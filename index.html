      function bindEvents() {
        document.querySelectorAll("[data-tab]").forEach(
          (b) =>
            (b.onclick = () => {
              state.tab = b.dataset.tab;
              render();
            }),
        );

        document.querySelectorAll("[data-view-recipe]").forEach((b) => {
          b.onclick = (e) => {
            e.stopPropagation();
            state.recipeDetail = b.dataset.viewRecipe;
            render();
          };
        });

        if (state.tab === "profil") {
          ["weight", "height", "age"].forEach((k) => {
            const el = document.getElementById("p-" + k);
            if (el)
              el.onchange = () => {
                state.profile[k] = Number(el.value) || 0;
                saveState();
                render();
              };
          });
        }

        if (state.tab === "bib") {
          const addBtn = document.getElementById("add-custom");
          if (addBtn)
            addBtn.onclick = () => {
              const name = document.getElementById("c-name").value.trim();
              if (!name) return;
              const id = "c" + Date.now();
              const meal = {
                id,
                name,
                moment: "diner",
                kcal: Number(document.getElementById("c-kcal").value) || 0,
                protein:
                  Number(document.getElementById("c-protein").value) || 0,
                carbs: Number(document.getElementById("c-carbs").value) || 0,
                fat: Number(document.getElementById("c-fat").value) || 0,
                src: "perso",
                veg: false,
              };
              state.custom.push(meal);
              state.validated.push(id);
              saveState();
              render();
            };
        }

        if (state.tab === "semaine") {
          const genBtn = document.getElementById("gen-week");
          if (genBtn)
            genBtn.onclick = () => {
              if (state.generating) return;
              state.generating = true;
              render();
              setTimeout(() => {
                generateWeek();
                state.generating = false;
                render();
              }, 30);
            };

          const saveBtn = document.getElementById("save-week");
          if (saveBtn)
            saveBtn.onclick = () => {
              saveCurrentWeek();
            };

          document.querySelectorAll("[data-select-day]").forEach((b) => {
            b.onclick = () => {
              state.activeDay = b.dataset.selectDay;
              render();
            };
          });

          document.querySelectorAll("[data-sview]").forEach((b) => {
            b.onclick = () => {
              state.semaineView = b.dataset.sview;
              render();
            };
          });

          document.querySelectorAll("[data-remove-day]").forEach((b) => {
            b.onclick = (e) => {
              e.stopPropagation();
              const i = Number(b.dataset.removeDay);
              const dayKey = b.dataset.removeKey || state.activeDay;
              state.plan[dayKey].splice(i, 1);
              saveState();
              render();
            };
          });

          document.querySelectorAll("[data-open-picker-day]").forEach((b) => {
            b.onclick = (e) => {
              e.stopPropagation();
              state.picker = { filter: "all", dayKey: b.dataset.openPickerDay };
              render();
            };
          });

          document.querySelectorAll("[data-restore-week]").forEach((b) => {
            b.onclick = () => {
              const sw = state.savedWeeks.find(
                (w) => w.id === Number(b.dataset.restoreWeek),
              );
              if (sw) {
                state.plan = JSON.parse(JSON.stringify(sw.plan));
                state.weekMessage = 'Semaine "' + sw.label + '" restaurée.';
                saveState();
                render();
              }
            };
          });

          document.querySelectorAll("[data-delete-week]").forEach((b) => {
            b.onclick = () => {
              state.savedWeeks = state.savedWeeks.filter(
                (w) => w.id !== Number(b.dataset.deleteWeek),
              );
              saveState();
              render();
            };
          });
        }

        const overlay = document.getElementById("overlay");
        if (overlay) {
          overlay.onclick = (e) => {
            if (e.target === overlay) {
              state.picker = null;
              render();
            }
          };
          document.querySelectorAll("[data-mf]").forEach(
            (b) =>
              (b.onclick = () => {
                state.picker.filter = b.dataset.mf;
                render();
              }),
          );
          document.querySelectorAll("[data-pick]").forEach(
            (b) =>
              (b.onclick = () => {
                const dayKey = state.picker.dayKey || state.activeDay;
                state.plan[dayKey].push(b.dataset.pick);
                state.picker = null;
                saveState();
                render();
              }),
          );
        }

        const recipeOverlay = document.getElementById("recipe-overlay");
        if (recipeOverlay) {
          recipeOverlay.onclick = (e) => {
            if (e.target === recipeOverlay) {
              state.recipeDetail = null;
              render();
            }
          };
          document.querySelectorAll("[data-close-recipe]").forEach(
            (b) =>
              (b.onclick = () => {
                state.recipeDetail = null;
                render();
              }),
          );
        }
      }

      loadState();
    </script>
  </body>
</html>

            "poisson_maigre",
            "poisson_gras",
            "oeuf",
          ],
        },
        { label: "🧀 Produits laitiers", cats: ["laitier"] },
        { label: "🫘 Légumineuses", cats: ["legumineuse"] },
        {
          label: "🌾 Féculents & céréales",
          cats: ["feculent_complet", "feculent_raffine"],
        },
        {
          label: "🫙 Épicerie, matières grasses & condiments",
          cats: ["matiere_grasse", "condiment", "sucre", "oleagineux"],
        },
      ];
      // Pour les courses on arrondit à la pièce entière supérieure (on ne
      // peut pas acheter une demi-banane) — contrairement à l'affichage dans
      // la recette qui arrondit au plus proche.
      function formatShoppingAmount(key, grams) {
        const u = INGREDIENT_UNITS[key];
        if (u && u.piece) {
          const count = Math.max(1, Math.ceil(grams / u.unitG));
          const label = count === 1 ? u.label : u.labelPlural;
          return `${count} ${label}`;
        }
        if (LIQUID_KEYS.has(key)) return `${Math.round(grams)} ml`;
        return `${Math.round(grams)} g`;
      }
      function renderShoppingListInner() {
        const totals = {};
        const breakdown = {}; // key -> [{ dayLabel, mealName, grams }]
        DAYS.forEach((day) => {
          planDayMeals(day.key).forEach(({ meal: m, scale }) => {
            if (!m.ingredients) return;
            const scalableCats = mealScalableCats(m);
            m.ingredients.forEach(([key, g]) => {
              const n = NUTRI[key];
              const f = n && scalableCats.has(n.cat) ? scale : 1;
              const amt = g * f;
              totals[key] = (totals[key] || 0) + amt;
              (breakdown[key] = breakdown[key] || []).push({
                dayLabel: day.label,
                mealName: m.name,
                grams: amt,
              });
            });
          });
        });
        const keys = Object.keys(totals);
        if (!keys.length)
          return `<p style="font-size:13px;color:var(--ink-soft);padding:2px 0;">La liste apparaît dès que des repas sont planifiés.</p>`;
        const row = (k) => `<details class="shop-item">
          <summary><div class="mname">${NUTRI[k] ? NUTRI[k].label : k}</div><span class="pill">${formatShoppingAmount(k, totals[k])}</span></summary>
          <div class="shop-item-detail">
            ${breakdown[k].map((b) => `<div class="shop-item-line"><span>${b.dayLabel} · ${b.mealName}</span><span>${formatIngredientAmount(k, b.grams, NUTRI[k])}</span></div>`).join("")}
          </div>
        </details>`;
        const seen = new Set();
        const sections = AISLES.map((aisle) => {
          const aisleKeys = keys
            .filter((k) => NUTRI[k] && aisle.cats.includes(NUTRI[k].cat))
            .sort((a, b) => NUTRI[a].label.localeCompare(NUTRI[b].label));
          aisleKeys.forEach((k) => seen.add(k));
          if (!aisleKeys.length) return "";
          return `<div class="shop-aisle">
        <div class="shop-aisle-title">${aisle.label}</div>
        ${aisleKeys.map(row).join("")}
      </div>`;
        }).join("");
        const leftoverKeys = keys
          .filter((k) => !seen.has(k))
          .sort((a, b) =>
            (NUTRI[a]?.label || a).localeCompare(NUTRI[b]?.label || b),
          );
        const leftoverHtml = leftoverKeys.length
          ? `<div class="shop-aisle">
        <div class="shop-aisle-title">🗂️ Autre</div>
        ${leftoverKeys.map(row).join("")}
      </div>`
          : "";
        const notes = conservationNotes(totals);
        const conservationHtml = notes.length
          ? `<div class="card" style="margin-top:10px;">
        <div style="font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-bottom:6px;">🧊 À finir rapidement une fois ouvert</div>
        ${notes.map((n) => `<div class="coherence-item"><span class="ic" style="color:var(--amber);">▲</span><div class="txt"><b>${n.label}</b> ${n.packages > 1 ? `${n.packages} × ${n.size}${n.unit}` : `un format ${n.size}${n.unit}`} pour ${n.needed}${n.unit} utilisés cette semaine → il restera environ ${n.leftover}${n.unit} une fois ouvert, à consommer sous ${n.vie}. Pense à en réutiliser un peu dans une autre recette si possible.</div></div>`).join("")}
      </div>`
          : "";
        return `<div class="card">${sections}${leftoverHtml}</div>${conservationHtml}`;
      }

      // Emballages/pots typiques pour les produits périssables une fois ouverts :
      // permet d'avertir quand une recette n'épuise pas tout le pot et qu'il
      // faudra le finir ailleurs dans la semaine pour éviter le gaspillage.
      const CONSERVATION_PACKAGES = {
        sauce_tomate: {
          size: 390,
          unit: "g",
          vie: "5-7 jours au frigo",
          days: 5,
        },
        creme_fraiche: { size: 200, unit: "g", vie: "4-5 jours", days: 4 },
        fromage_frais_leger: {
          size: 150,
          unit: "g",
          vie: "4-5 jours",
          days: 4,
        },
        lait: { size: 1000, unit: "ml", vie: "3-4 jours", days: 4 },
        fromage_blanc: { size: 500, unit: "g", vie: "4-5 jours", days: 4 },
        fromage_blanc_0: { size: 500, unit: "g", vie: "4-5 jours", days: 4 },
        skyr: { size: 450, unit: "g", vie: "environ 1 semaine", days: 7 },
      };
      // Pour chaque périssable, la recette "extra" ultra-rapide qui permet
      // de le finir sans en faire un vrai repas.
      const PERISH_QUICK_EXTRA = {
        lait: "m131",
        fromage_frais_leger: "m133",
        fromage_blanc_0: "m134",
        fromage_blanc: "m134",
        skyr: "m135",
      };
      function conservationNotes(totals) {
        return Object.keys(CONSERVATION_PACKAGES)
          .filter((k) => totals[k])
          .map((k) => {
            const info = CONSERVATION_PACKAGES[k];
            const needed = totals[k];
            const packages = Math.max(1, Math.ceil(needed / info.size));
            const leftover = Math.round(packages * info.size - needed);
            return {
              key: k,
              label: NUTRI[k] ? NUTRI[k].label : k,
              needed: Math.round(needed),
              packages,
              size: info.size,
              unit: info.unit,
              leftover,
              vie: info.vie,
            };
          })
          .filter((n) => n.leftover > n.size * 0.15);
      }

      function renderCoherenceItems() {
        const stats = weekStats(state.plan);
        const line = (status, title, txt) => {
          const ic = status === "ok" ? "●" : "▲";
          const color = status === "ok" ? "var(--green)" : "var(--amber)";
          return `<div class="coherence-item"><span class="ic" style="color:${color}">${ic}</span><div class="txt"><b>${title}</b>${txt}</div></div>`;
        };
        return [
          line(
            stats.rules.legFruit ? "ok" : "warn",
            stats.rules.legFruit
              ? "Fruits & légumes OK"
              : "Fruits & légumes insuffisants",
            ` ${stats.legFruitGrams}g (${stats.legFruitPct}% du repère PNNS 5 : ~2800g/sem.)`,
          ),
          line(
            stats.rules.legumineuses ? "ok" : "warn",
            stats.rules.legumineuses
              ? "Légumineuses présentes"
              : "Pas assez de légumineuses",
            ` ${stats.legumineuseCount} repas (min 2/sem).`,
          ),
          line(
            stats.rules.poisson ? "ok" : "warn",
            stats.rules.poisson ? "Poisson présent" : "Pas assez de poisson",
            ` ${stats.poissonCount} repas dont ${stats.oilyFishCount} gras (min 2/sem dont 1 gras).`,
          ),
          line(
            stats.rules.thonLimit ? "ok" : "warn",
            stats.rules.thonLimit ? "Thon limité" : "Trop de thon",
            ` ${stats.thonCount} repas au thon cette semaine (max 2/sem, par précaution sur le mercure).`,
          ),
          line(
            stats.rules.perishCluster ? "ok" : "warn",
            stats.rules.perishCluster
              ? "Périssables bien groupés"
              : "Périssables trop étalés",
            stats.perishViolations.length
              ? ` ${stats.perishViolations.map((k) => (NUTRI[k] ? NUTRI[k].label : k)).join(", ")} : utilisé(s) sur plus de jours que leur conservation une fois ouvert(s) — risque de gâchis ou de racheter en double.`
              : " Chaque produit ouvert (lait, crème, houmous...) est utilisé dans sa fenêtre de conservation.",
          ),
          line(
            stats.rules.redMeat ? "ok" : "warn",
            stats.rules.redMeat ? "Viande rouge OK" : "Trop de viande rouge",
            ` ${stats.redMeatGrams}g (recommandation PNNS 5 : max 500g/sem — l'appli vise ${RED_MEAT_SAFE}g pour garder une vraie marge).`,
          ),
          line(
            stats.rules.charcuterie ? "ok" : "warn",
            stats.rules.charcuterie ? "Charcuterie OK" : "Trop de charcuterie",
            ` ${stats.charcuterieGrams}g (recommandation : max 150g/sem — l'appli vise ${CHARCUTERIE_SAFE}g pour garder une vraie marge).`,
          ),
          line(
            stats.rules.dairy ? "ok" : "warn",
            stats.rules.dairy ? "Produits laitiers OK" : "Peu de laitiers",
            ` ${stats.dairyCount} repas (repère ~14/sem).`,
          ),
          line(
            stats.rules.complet ? "ok" : "warn",
            stats.rules.complet
              ? "Céréales complètes OK"
              : "Trop de féculents raffinés",
            ` ${stats.completPct}% de féculents complets.`,
          ),
          line(
            stats.rules.fat ? "ok" : "warn",
            stats.rules.fat
              ? "Lipides sous contrôle"
              : "Lipides au-dessus du quota",
            ` ${stats.weekFatTotal}g / ${stats.weekFatTarget}g (${Math.round(stats.fatRatio * 100)}%).`,
          ),
          line(
            stats.rules.dailyKcal ? "ok" : "warn",
            stats.rules.dailyKcal
              ? "Kcal entraînement OK"
              : "Kcal entraînement à compléter",
            ` Moy. jours entraînement: ${stats.trainingKcalAvg} / ${stats.trainingTargetAvg} kcal (~${Math.round((stats.trainingKcalAvg / Math.max(1, stats.trainingTargetAvg)) * 100)}%).`,
          ),
          line(
            stats.rules.dailyDiversity ? "ok" : "warn",
            stats.rules.dailyDiversity
              ? "Variété journalière OK"
              : "Répétition dans certaines journées",
            " Sources de protéines variées dans chaque journée.",
          ),
          line(
            stats.rules.workSnack ? "ok" : "warn",
            stats.rules.workSnack
              ? "Collations boulot OK"
              : "Collations non adaptées",
            " Toutes les collations sont transportables sans frigo.",
          ),
          line(
            stats.rules.wheyFree ? "ok" : "warn",
            "Sans whey",
            " Aucune whey dans la semaine.",
          ),
          line(
            stats.rules.variety ? "ok" : "warn",
            stats.rules.variety ? "Variété hebdo OK" : "Variété faible",
            ` ${stats.varietyCount} sources protéiques différentes cette semaine.`,
          ),
          stats.repeatedMeals.length
            ? line(
                "warn",
                "Répétition à surveiller",
                " " +
                  stats.repeatedMeals.map((m) => m.name).join(", ") +
                  " revient souvent.",
              )
            : line(
                "ok",
                "Pas de répétition excessive",
                " Chaque repas au plus 3×/semaine.",
              ),
        ].join("");
      }

      function renderSavedWeeks() {
        const saved = state.savedWeeks;
        let html = "";
        if (!saved.length) {
          html += `<p style="font-size:13px;color:var(--ink-soft);padding:2px 0 8px;">Aucune semaine sauvegardée. Génère une semaine puis clique sur "Sauvegarder".</p>`;
        } else {
          html += `<div class="card">`;
          saved
            .slice()
            .reverse()
            .forEach((sw) => {
              html += `<div class="saved-week-row">
        <div class="sw-info">
          <div class="sw-label">${sw.label}</div>
          <div class="sw-date">${sw.date}</div>
        </div>
        <div class="sw-actions">
          <button class="small" data-restore-week="${sw.id}">Restaurer</button>
          <button class="small reject" data-delete-week="${sw.id}">✕</button>
        </div>
      </div>`;
            });
          html += `</div>`;
        }
        return html;
      }

      function saveCurrentWeek() {
        const hasAny = Object.values(state.plan).some((ids) => ids.length > 0);
        if (!hasAny) return;
        const now = new Date();
        const dateStr = now.toLocaleDateString("fr-FR", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });
        const id = now.getTime();
        state.savedWeeks.push({
          id,
          label: "Semaine du " + dateStr,
          date: dateStr,
          plan: JSON.parse(JSON.stringify(state.plan)),
        });
        saveState();
        render();
      }

      function renderRecipeDetailModal() {
        const m = mealById(state.recipeDetail);
        if (!m) return "";
        const x = mac(m);
        const steps = generateSteps(m);
        return `<div class="overlay" id="recipe-overlay">
    <div class="sheet">
      <button class="close-x" data-close-recipe>✕</button>
      <h3>${m.name}</h3>
      <div class="mmacro" style="margin-bottom:14px;">${MOMENT_LABEL[m.moment]} · ${x.kcal} kcal · ${x.protein}P/${x.carbs}G/${x.fat}L</div>
      ${
        m.ingredients
          ? `<div style="font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:6px;">Ingrédients</div>
      <div class="ingr-chips" style="margin-bottom:16px;">${ingredientChips(m)}</div>`
          : ""
      }
      <div style="font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:8px;">Préparation</div>
      <ol style="margin:0;padding-left:18px;">
        ${steps.map((s) => `<li style="font-size:13.5px;line-height:1.6;margin-bottom:6px;">${s}</li>`).join("")}
      </ol>
    </div>
  </div>`;
      }

      function renderPicker() {
        const filter = state.picker.filter || "all";
        const dayKey = state.picker.dayKey || state.activeDay;
        const day = DAYS.find((d) => d.key === dayKey);
        const lib = libraryMeals().filter(
          (m) => filter === "all" || m.moment === filter,
        );
        return `<div class="overlay" id="overlay">
    <div class="sheet">
      <h3>Ajouter un repas à ${day ? day.label : "la journée"}</h3>
      <div class="moment-filter">
        ${[
          "all",
          "petitdej",
          "collationmatin",
          "dejeuner",
          "collationapresmidi",
          "diner",
        ]
          .map(
            (k) => `
          <button class="mf-btn ${filter === k ? "active" : ""}" data-mf="${k}">${k === "all" ? "Tous" : MOMENT_LABEL[k]}</button>
        `,
          )
          .join("")}
      </div>
      ${
        lib.length === 0
          ? '<p style="font-size:13px;color:var(--ink-soft);">Aucun repas validé dans cette catégorie.</p>'
          : lib
              .map(
                (m) => `<div class="picker-item" data-pick="${m.id}">
          <div style="flex:1;"><div class="mname">${m.name}</div><div class="mmacro">${mac(m).kcal} kcal · ${mac(m).protein}P/${mac(m).carbs}G/${mac(m).fat}L</div>${m.ingredients ? `<div class="ingr-chips">${ingredientChips(m)}</div>` : ""}</div>
          <span style="font-size:20px;color:var(--green);flex:none;">+</span>
        </div>`,
              )
              .join("")
      }
    </div>
  </div>`;
      }

      function bindEvents() {
        document.querySelectorAll("[data-tab]").forEach(
          (b) =>
            (b.onclick = () => {
              state.tab = b.dataset.tab;
              render();
            }),
        );

        document.querySelectorAll("[data-view-recipe]").forEach((b) => {
          b.onclick = (e) => {
            e.stopPropagation();
            state.recipeDetail = b.dataset.viewRecipe;
            render();
          };
        });

        if (state.tab === "profil") {
          ["weight", "height", "age"].forEach((k) => {
            const el = document.getElementById("p-" + k);
            if (el)
              el.onchange = () => {
                state.profile[k] = Number(el.value) || 0;
                saveState();
                render();
              };
          });
        }

        if (state.tab === "bib") {
          const addBtn = document.getElementById("add-custom");
          if (addBtn)
            addBtn.onclick = () => {
              const name = document.getElementById("c-name").value.trim();
              if (!name) return;
              const id = "c" + Date.now();
              const meal = {
                id,
                name,
                moment: "diner",
                kcal: Number(document.getElementById("c-kcal").value) || 0,
                protein:
                  Number(document.getElementById("c-protein").value) || 0,
                carbs: Number(document.getElementById("c-carbs").value) || 0,
                fat: Number(document.getElementById("c-fat").value) || 0,
                src: "perso",
                veg: false,
              };
              state.custom.push(meal);
              state.validated.push(id);
              saveState();
              render();
            };
        }

        if (state.tab === "semaine") {
          const genBtn = document.getElementById("gen-week");
          if (genBtn)
            genBtn.onclick = () => {
              generateWeek();
            };

          const saveBtn = document.getElementById("save-week");
          if (saveBtn)
            saveBtn.onclick = () => {
              saveCurrentWeek();
            };

          document.querySelectorAll("[data-select-day]").forEach((b) => {
            b.onclick = () => {
              state.activeDay = b.dataset.selectDay;
              render();
            };
          });

          document.querySelectorAll("[data-sview]").forEach((b) => {
            b.onclick = () => {
              state.semaineView = b.dataset.sview;
              render();
            };
          });

          document.querySelectorAll("[data-remove-day]").forEach((b) => {
            b.onclick = (e) => {
              e.stopPropagation();
              const i = Number(b.dataset.removeDay);
              const dayKey = b.dataset.removeKey || state.activeDay;
              state.plan[dayKey].splice(i, 1);
              saveState();
              render();
            };
          });

          document.querySelectorAll("[data-open-picker-day]").forEach((b) => {
            b.onclick = (e) => {
              e.stopPropagation();
              state.picker = { filter: "all", dayKey: b.dataset.openPickerDay };
              render();
            };
          });

          document.querySelectorAll("[data-restore-week]").forEach((b) => {
            b.onclick = () => {
              const sw = state.savedWeeks.find(
                (w) => w.id === Number(b.dataset.restoreWeek),
              );
              if (sw) {
                state.plan = JSON.parse(JSON.stringify(sw.plan));
                state.weekMessage = 'Semaine "' + sw.label + '" restaurée.';
                saveState();
                render();
              }
            };
          });

          document.querySelectorAll("[data-delete-week]").forEach((b) => {
            b.onclick = () => {
              state.savedWeeks = state.savedWeeks.filter(
                (w) => w.id !== Number(b.dataset.deleteWeek),
              );
              saveState();
              render();
            };
          });
        }

        const overlay = document.getElementById("overlay");
        if (overlay) {
          overlay.onclick = (e) => {
            if (e.target === overlay) {
              state.picker = null;
              render();
            }
          };
          document.querySelectorAll("[data-mf]").forEach(
            (b) =>
              (b.onclick = () => {
                state.picker.filter = b.dataset.mf;
                render();
              }),
          );
          document.querySelectorAll("[data-pick]").forEach(
            (b) =>
              (b.onclick = () => {
                const dayKey = state.picker.dayKey || state.activeDay;
                state.plan[dayKey].push(b.dataset.pick);
                state.picker = null;
                saveState();
                render();
              }),
          );
        }

        const recipeOverlay = document.getElementById("recipe-overlay");
        if (recipeOverlay) {
          recipeOverlay.onclick = (e) => {
            if (e.target === recipeOverlay) {
              state.recipeDetail = null;
              render();
            }
          };
          document.querySelectorAll("[data-close-recipe]").forEach(
            (b) =>
              (b.onclick = () => {
                state.recipeDetail = null;
                render();
              }),
          );
        }
      }

      loadState();
    </script>
  </body>
</html>

<!doctype html>
<!-- REGLES DES REPAS
 - But : prendre du muscle proprement
 - Pas de whey
 - Je n'ai pas de mixeur
 - Portions poulet : 150g, Portions de steak haché : 125g, Portions de saumon : pavé standard vendu en barquette, Portions de dinde : 150g
 - On évite les repas secs (par exemple fromage blanc + flocons avoine) et on privilégie les repas qui se digèrent bien
 - Il me faut des repas avec des aliments qui se réutilisent facilement / se perdent rapidement une fois ouverts

-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réserve — mes repas de la semaine</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap");

      :root {
        --bg: #faf6ef;
        --paper: #ffffff;
        --ink: #23281f;
        --ink-soft: #6b7268;
        --green: #2f5233;
        --green-soft: #e4ebe0;
        --amber: #c98a2b;
        --amber-soft: #f6e8d1;
        --brick: #b23a2e;
        --brick-soft: #f5dedb;
        --protein: #8e5fd6;
        --protein-soft: #f2ebfa;
        --carbs: #5c7cf7;
        --carbs-soft: #ebeffe;
        --fat: #b0508f;
        --fat-soft: #faebf2;
        --radius: 16px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--bg);
        padding-bottom: 84px;
        position: relative;
      }
      header.top {
        padding: 28px 20px 18px;
        border-bottom: 1px solid var(--border);
      }
      header.top .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--green);
        font-weight: 600;
      }
      header.top h1 {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 28px;
        margin: 4px 0 0;
        letter-spacing: -0.01em;
      }
      main {
        padding: 18px 20px 8px;
      }
      .card {
        background: var(--paper);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        margin-bottom: 14px;
      }
      .card h2 {
        font-family: "Fraunces", serif;
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .field {
        flex: 1;
      }
      label {
        display: block;
        font-size: 11px;
        font-family: "JetBrains Mono", monospace;
        color: var(--ink-soft);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 5px;
      }
      input[type="number"] {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 9px 10px;
        font-size: 15px;
        font-family: "JetBrains Mono", monospace;
        background: var(--bg);
        color: var(--ink);
      }
      input[type="number"]:focus {
        outline: 2px solid var(--green);
        outline-offset: 1px;
      }

      /* jar signature element */
      .jar-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 14px;
      }
      .jar-svg {
        flex-shrink: 0;
      }
      .jar-stats {
        flex: 1;
      }
      .jar-kcal {
        font-family: "Fraunces", serif;
        font-size: 26px;
        font-weight: 600;
      }
      .jar-kcal small {
        font-family: "Inter";
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-soft);
      }
      .jar-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--ink-soft);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-top: 2px;
      }

      .macrobar {
        margin-top: 10px;
      }
      .macrobar .mb-top {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        font-family: "JetBrains Mono", monospace;
        color: var(--ink-soft);
        margin-bottom: 4px;
      }
      .mb-track {
        height: 8px;
        border-radius: 6px;
        background: var(--bg);
        border: 1px solid var(--border);
        overflow: hidden;
      }
      .mb-fill {
        height: 100%;
        border-radius: 6px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        padding: 3px 9px;
        border-radius: 100px;
        background: var(--green-soft);
        color: var(--green);
        font-weight: 600;
      }
      .pill.amber {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .pill.brick {
        background: var(--brick-soft);
        color: var(--brick);
      }

      .suggest-card {
        background: var(--paper);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        margin-bottom: 14px;
      }
      .suggest-card .name {
        font-family: "Fraunces", serif;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .suggest-card .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      .tag {
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        color: var(--ink-soft);
        background: var(--bg);
        border: 1px solid var(--border);
        padding: 3px 8px;
        border-radius: 100px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .macro-line {
        font-family: "JetBrains Mono", monospace;
        font-size: 12.5px;
        color: var(--ink-soft);
        margin-bottom: 12px;
      }
      .btn-row {
        display: flex;
        gap: 10px;
      }
      button {
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 10px 14px;
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
        flex: 1;
      }
      button.primary {
        background: var(--green);
        color: #fff;
        border-color: var(--green);
      }
      button.reject {
        color: var(--brick);
      }
      button.small {
        flex: none;
        padding: 7px 12px;
        font-size: 12.5px;
      }
      button:active {
        transform: scale(0.98);
      }

      .empty {
        text-align: center;
        padding: 36px 20px;
        color: var(--ink-soft);
      }
      .empty .glyph {
        font-size: 34px;
        margin-bottom: 8px;
      }
      .empty p {
        font-size: 13.5px;
        line-height: 1.5;
        margin: 0;
      }

      nav.tabs {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-width: 480px;
        margin: 0 auto;
        background: var(--paper);
        border-top: 1px solid var(--border);
        display: flex;
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        gap: 4px;
      }
      nav.tabs button {
        flex: 1;
        background: none;
        border: none;
        font-family: "Inter";
        font-weight: 600;
        font-size: 11.5px;
        color: var(--ink-soft);
        padding: 8px 4px 6px;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }

      /* Layout robuste : les libellés des boutons restent sur une ligne
         et ne repoussent plus les boutons voisins. */
      .btn-row {
        align-items: stretch;
      }

      .btn-row button {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-left: 10px;
        padding-right: 10px;
      }

      .day-head-card {
        padding: 16px 16px 14px;
      }
      .day-head-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .day-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .day-mode {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--ink-soft);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 100px;
        padding: 3px 10px;
        white-space: nowrap;
      }
      .day-mode.is-training {
        color: var(--green);
        border-color: var(--green);
        background: var(--green-soft);
      }
      .day-kcal-row {
        display: flex;
        align-items: baseline;
        gap: 5px;
        margin-top: 10px;
      }
      .day-kcal {
        font-family: "JetBrains Mono", monospace;
        font-size: 26px;
        font-weight: 700;
      }
      .day-kcal-target {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--ink-soft);
      }
      .day-macros {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }
      .day-macro {
        flex: 1;
        min-width: 0;
      }
      .dm-top {
        display: flex;
        justify-content: space-between;
        font-family: "JetBrains Mono", monospace;
        font-size: 9.5px;
        color: var(--ink-soft);
        margin-bottom: 4px;
      }
      .day-macro {
        flex: 1;
        min-width: 0;
        background: var(--bg);
        border-radius: 10px;
        padding: 7px 9px 8px;
      }
      .day-macro:nth-child(1) {
        background: var(--protein-soft);
      }
      .day-macro:nth-child(2) {
        background: var(--carbs-soft);
      }
      .day-macro:nth-child(3) {
        background: var(--fat-soft);
      }
      .dm-p {
        background: var(--protein);
      }
      .dm-c {
        background: var(--carbs);
      }
      .dm-f {
        background: var(--fat);
      }

      .suggest-card .name,
      .meal-row-full .mname {
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .suggest-card .macro-line {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .card h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .card h2 .pill {
        flex: 0 0 auto;
        white-space: nowrap;
      }

      @media (max-width: 390px) {
        .suggest-card {
          padding: 15px;
        }

        .btn-row {
          gap: 7px;
        }

        .btn-row button {
          font-size: 12.5px;
          padding: 9px 8px;
        }
      }

      nav.tabs button.active {
        color: var(--green);
        background: var(--green-soft);
      }
      nav.tabs button .ico {
        font-size: 18px;
      }

      .day-tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 4px;
        margin-bottom: 14px;
      }
      .day-tab {
        flex-shrink: 0;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--paper);
        color: var(--ink-soft);
        cursor: pointer;
      }
      .day-tab.active {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .day-tab .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        margin-left: 5px;
        vertical-align: middle;
      }

      .meal-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 0;
        border-bottom: 1px solid var(--border);
      }
      .meal-row:last-child {
        border-bottom: none;
      }
      .meal-row .mname {
        font-size: 14px;
        font-weight: 600;
      }
      .meal-row .mmacro {
        font-family: "JetBrains Mono", monospace;
        font-size: 11.5px;
        color: var(--ink-soft);
      }
      .meal-row .rm,
      .meal-row-full .rm {
        background: var(--brick-soft);
        border: none;
        color: var(--brick);
        font-size: 15px;
        line-height: 1;
        flex: none;
        width: 34px;
        height: 34px;
        min-width: 34px;
        padding: 0;
        border-radius: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .meal-row .rm:active,
      .meal-row-full .rm:active {
        background: var(--brick);
        color: #fff;
      }
      .rm-info {
        background: var(--green-soft);
        border: none;
        font-size: 15px;
        line-height: 1;
        flex: none;
        width: 34px;
        height: 34px;
        min-width: 34px;
        padding: 0;
        border-radius: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .rm-info:active {
        background: var(--green);
      }
      .meal-row-full {
        padding: 11px 0;
        border-bottom: 1px solid var(--border);
      }
      .meal-row-full:last-child {
        border-bottom: none;
      }
      .meal-row-full .mname {
        font-size: 16px;
        font-weight: 600;
      }
      .meal-row-full .mmacro {
        font-family: "JetBrains Mono", monospace;
        font-size: 11.5px;
        color: var(--ink-soft);
        margin-top: 2px;
      }
      .ingr-line {
        font-size: 11px;
        color: var(--ink-soft);
        line-height: 1.6;
        margin-top: 4px;
      }
      .ingr-chips {
        font-size: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 3px 5px;
        margin-top: 4px;
      }
      .ingr-chip {
        font-size: 10px;
        color: var(--ink-soft);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 100px;
        padding: 1px 7px;
        white-space: nowrap;
        line-height: 1.4;
      }

      .day-timeline {
        display: flex;
        flex-direction: column;
        gap: 18px;
        margin-top: 4px;
      }
      .day-period {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      .day-period-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-soft);
        padding-bottom: 5px;
        border-bottom: 1px solid var(--border);
      }
      .meal-card {
        position: relative;
        cursor: pointer;
        background: var(--bg);
        border: 1px solid transparent;
        border-radius: 12px;
        padding: 13px 13px 12px 13px;
        display: flex;
        flex-direction: column;
        height: 100%;
        transition:
          border-color 0.15s ease,
          transform 0.1s ease,
          background 0.15s ease;
      }
      .meal-card:hover {
        border-color: var(--border);
      }
      .meal-card:active {
        transform: scale(0.98);
        background: var(--border);
      }

      .day-period-meals {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .meal-card .mc-rm {
        position: absolute;
        top: 8px;
        right: 8px;
        background: none;
        border: none;
        color: var(--ink-soft);
        width: 22px;
        height: 22px;
        min-width: 22px;
        border-radius: 100px;
        font-size: 12px;
        line-height: 1;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .meal-card .mc-rm:active {
        background: var(--paper);
        color: var(--ink);
      }
      .meal-card .mc-head-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-bottom: 5px;
      }
      .meal-card .mc-moment {
        font-family: "JetBrains Mono", monospace;
        font-size: 9.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin-bottom: 0;
      }
      .meal-card .mc-name {
        font-size: 14.5px;
        font-weight: 600;
        line-height: 1.32;
      }
      .meal-card .mc-tag {
        font-family: "JetBrains Mono", monospace;
        font-size: 8.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 100px;
        padding: 1px 7px;
        display: inline-block;
        margin-top: 6px;
        width: fit-content;
      }
      .meal-card .mc-foot {
        margin-top: auto;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }
      .meal-card .mc-kcal {
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
        font-weight: 700;
        color: var(--ink);
      }
      .meal-card .mc-kcal-unit {
        font-family: "Inter", sans-serif;
        font-size: 10.5px;
        font-weight: 500;
        color: var(--ink-soft);
        margin-left: 2px;
      }
      .mc-bar {
        display: flex;
        height: 5px;
        border-radius: 3px;
        overflow: hidden;
        background: var(--border);
        margin: 7px 0 6px;
      }
      .mc-bar-p {
        background: var(--protein);
      }
      .mc-bar-c {
        background: var(--carbs);
      }
      .mc-bar-f {
        background: var(--fat);
      }
      .day-comp-bar {
        margin: 12px 0;
      }
      .meal-card .mc-macro-row {
        display: flex;
        justify-content: space-between;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        color: var(--ink-soft);
      }
      .meal-card .mc-open {
        flex-shrink: 0;
        color: var(--ink-soft);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .meal-card.is-expanded .mc-open svg {
        transform: rotate(90deg);
      }
      .mc-recipe {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }
      .mc-recipe-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
        margin-bottom: 6px;
      }
      .mc-recipe-steps {
        margin: 0;
        padding-left: 16px;
      }
      .mc-recipe-steps li {
        font-size: 12.5px;
        line-height: 1.55;
        margin-bottom: 5px;
      }

      .picker-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }
      .picker-item:last-child {
        border-bottom: none;
      }
      .picker-item .mname {
        font-weight: 600;
        font-size: 14px;
      }
      .picker-item .mmacro {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--ink-soft);
      }

      .coherence-item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 8px 0;
      }
      .coherence-item .ic {
        font-size: 16px;
        flex: none;
      }
      .coherence-item .txt {
        font-size: 13px;
        line-height: 1.4;
      }
      .coherence-item .txt b {
        display: block;
        font-size: 13px;
        margin-bottom: 1px;
      }

      .section-title {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ink-soft);
        margin: 20px 0 8px;
        padding: 0 2px;
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(35, 40, 31, 0.45);
        display: flex;
        align-items: flex-end;
        z-index: 50;
      }
      .sheet {
        background: var(--paper);
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        border-radius: 20px 20px 0 0;
        padding: 20px;
        max-height: 75vh;
        overflow-y: auto;
      }
      .sheet h3 {
        font-family: "Fraunces", serif;
        font-size: 19px;
        margin: 0 0 4px;
      }
      .sheet .close-x {
        position: sticky;
        top: 0;
        text-align: right;
      }
      .recipe-overlay {
        align-items: stretch;
        justify-content: flex-end;
      }
      .recipe-panel {
        width: 100%;
        max-width: 400px;
        height: 100%;
        margin: 0;
        border-radius: 0;
        max-height: none;
        box-shadow: -10px 0 28px rgba(35, 40, 31, 0.18);
        animation: recipe-slide-in 0.22s ease;
      }
      @keyframes recipe-slide-in {
        from {
          transform: translateX(100%);
        }
        to {
          transform: translateX(0);
        }
      }
      @media (max-width: 480px) {
        .recipe-panel {
          max-width: 100%;
        }
      }
      .moment-filter {
        display: flex;
        gap: 6px;
        margin: 10px 0 4px;
        flex-wrap: wrap;
      }
      .mf-btn {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        padding: 5px 10px;
        border-radius: 100px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--ink-soft);

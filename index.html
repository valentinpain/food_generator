          case "four":
            steps.push(`Préchauffe le four à 200°C.`);
            if (seasonings.length)
              steps.push(
                `Enrobe ${proteinLbl} avec ${seasonLbl} et un filet d'huile.`,
              );
            steps.push(
              `Dispose ${proteinLbl}${cookStarches.length ? ` et ${starchLbl} coupé(s) en morceaux` : ""} sur une plaque, enfourne 20-25 min.`,
            );
            if (vegs.length)
              steps.push(
                `Ajoute ${vegLbl} sur la plaque à mi-cuisson (10 min avant la fin).`,
              );
            break;
          case "mijote":
            steps.push(
              `Fais revenir ${proteinLbl} à la poêle avec un filet d'huile${seasonings.length ? ` et ${seasonLbl}` : ""} jusqu'à coloration.`,
            );
            if (cookStarches.length)
              steps.push(
                `Fais cuire ${starchLbl} à part, selon les indications du paquet.`,
              );
            steps.push(
              `Ajoute ${vegLbl || "la sauce tomate"} dans la poêle, couvre et laisse mijoter 15-20 min à feu doux en remuant de temps en temps.`,
            );
            break;
          case "wok":
            if (cookStarches.length)
              steps.push(
                `Fais cuire ${starchLbl} selon les indications du paquet (idéalement à l'avance : un féculent froid se saisit mieux).`,
              );
            steps.push(
              `Fais chauffer un filet d'huile à feu vif dans un wok ou une grande poêle, saisis ${proteinLbl} 3-5 min.`,
            );
            if (vegs.length)
              steps.push(`Ajoute ${vegLbl}, fais sauter 3-4 min à feu vif.`);
            steps.push(
              `Incorpore ${starchLbl || "le reste des ingrédients"}${seasonings.length ? ` et ${seasonLbl}` : ""}, mélange 2 min à feu vif et sers aussitôt.`,
            );
            break;
          case "toutenun": {
            const PRECOOKED = new Set([
              "thon_boite",
              "sardine_boite",
              "jambon_blanc",
              "pois_chiches_boite",
              "haricots_rouges_boite",
            ]);
            const allPrecooked =
              proteins.length > 0 && proteins.every((p) => PRECOOKED.has(p));
            if (cookStarches.length)
              steps.push(
                `Fais cuire ${starchLbl} selon les indications du paquet, puis égoutte-le en gardant la casserole.`,
              );
            if (!allPrecooked) {
              steps.push(
                `Pendant ce temps, fais cuire ${proteinLbl} à la poêle avec un filet d'huile${seasonings.length ? ` et ${seasonLbl}` : ""} jusqu'à cuisson complète.`,
              );
            }
            steps.push(
              `Remets ${cookStarches.length ? starchLbl : "tous les ingrédients"} dans la même casserole avec ${proteinLbl}${vegs.length ? ` et ${vegLbl}` : ""}${allPrecooked && seasonings.length ? ` et ${seasonLbl}` : ""}, ajoute ${dairyLbl || "le fromage"}, mélange à feu doux 2-3 min jusqu'à ce que ça fonde et enrobe bien le tout.`,
            );
            steps.push("Tout est fondant et saucé — sers aussitôt.");
            break;
          }
          case "assemblage": {
            if (proteins.includes("lentilles_crues"))
              steps.push(
                `Fais cuire les lentilles dans l'eau bouillante non salée 20-25 min, égoutte et laisse refroidir.`,
              );
            if (m.name.toLowerCase().includes("dur"))
              steps.push(
                `Fais cuire les œufs 9-10 min dans l'eau bouillante, refroidis-les sous l'eau froide puis écale-les.`,
              );
            const allBits = [...vegs, ...extras];
            steps.push(
              `Assemble ou mélange tous les ingrédients${allBits.length ? ` (${joinLabels(allBits)} compris)` : ""}${seasonings.length ? `, assaisonne avec ${seasonLbl}` : ""} et sers.`,
            );
            break;
          }
          case "pane": {
            steps.push(`Coupe ${proteinLbl} en morceaux ou en escalopes.`);
            steps.push(
              `Passe-les dans ${flourLbl} puis dans l'œuf battu${seasonings.length ? `, assaisonné(e) de ${seasonLbl}` : ""}.`,
            );
            steps.push(
              "Fais chauffer un filet d'huile dans une poêle et fais cuire 3-4 min de chaque côté jusqu'à ce que ce soit doré et cuit à cœur.",
            );
            if (vegs.length) steps.push(`Sers avec ${vegLbl}.`);
            break;
          }
          case "galette": {
            const otherProteins = proteins.filter(
              (p) => p !== "oeuf" && p !== "blanc_oeuf",
            );
            steps.push(
              `Mélange ${joinLabels(otherProteins) || proteinLbl}, ${flourLbl} et l'œuf${seasonings.length ? ` avec ${seasonLbl}` : ""} pour former une pâte homogène.`,
            );
            steps.push("Façonne des petites galettes avec les mains.");
            steps.push(
              "Fais chauffer un filet d'huile dans une poêle et fais cuire les galettes 3-4 min de chaque côté jusqu'à ce qu'elles soient dorées.",
            );
            if (vegs.length)
              steps.push(
                `Sers avec ${vegLbl}, sauté(e)s ou crus selon ton goût.`,
              );
            break;
          }
          case "poele":
          default: {
            if (cookStarches.length)
              steps.push(
                `Fais cuire ${starchLbl} selon les indications du paquet.`,
              );
            const introCook = cookStarches.length
              ? "Pendant ce temps, fais"
              : "Fais";
            steps.push(
              `${introCook} chauffer un filet d'huile dans une poêle et fais cuire ${proteinLbl} à feu moyen jusqu'à cuisson complète (retourne à mi-cuisson).`,
            );
            if (vegs.length)
              steps.push(
                `Ajoute ${vegLbl}${seasonings.length ? ` et ${seasonLbl}` : ""}, fais revenir 5-8 min.`,
              );
            else if (seasonings.length)
              steps.push(`Assaisonne avec ${seasonLbl}.`);
            let finalLine = "Mélange le tout";
            const finishBits = [...dairy, ...extras];
            if (finishBits.length)
              finalLine += `, ajoute ${joinLabels(finishBits)}`;
            finalLine += breadStarches.length
              ? `, sers avec ${breadLbl}.`
              : " et sers.";
            steps.push(finalLine);
            break;
          }
        }
        return steps;
      }
      // Grammes d'une catégorie (PNNS) dans un repas donné, pour les repères "légumes", "poisson gras", etc.
      function categoryGrams(m, cat, scale) {
        scale = scale || 1;
        if (!m.ingredients) return 0;
        const f = mealScalableCats(m).has(cat) ? scale : 1;
        return m.ingredients
          .filter(([key]) => NUTRI[key] && NUTRI[key].cat === cat)
          .reduce((s, [, g]) => s + g * f, 0);
      }
      function mealHasCategory(m, cats) {
        if (!m.ingredients) return false;
        return m.ingredients.some(
          ([key]) => NUTRI[key] && cats.includes(NUTRI[key].cat),
        );
      }

      function mealSelGrams(m, scale) {
        scale = scale || 1;
        if (!m.ingredients) return 0;
        const scalableCats = mealScalableCats(m);
        return m.ingredients.reduce((s, [key, g]) => {
          const sel = SEL_PAR_100G[key];
          if (!sel) return s;
          const n = NUTRI[key];
          const f = n && scalableCats.has(n.cat) ? scale : 1;
          return s + (sel * g * f) / 100;
        }, 0);
      }

      function mealSucreGrams(m, scale) {
        scale = scale || 1;
        if (!m.ingredients) return 0;
        const scalableCats = mealScalableCats(m);
        return m.ingredients.reduce((s, [key, g]) => {
          const sucre = SUCRE_PAR_100G[key];
          if (!sucre) return s;
          const n = NUTRI[key];
          const f = n && scalableCats.has(n.cat) ? scale : 1;
          return s + (sucre * g * f) / 100;
        }, 0);
      }

      function mealContainsIngredient(m, key) {
        if (!m.ingredients) return false;
        return m.ingredients.some(([k]) => k === key);
      }
      function ingredientGrams(m, key) {
        if (!m.ingredients) return 0;
        const found = m.ingredients.find(([k]) => k === key);
        return found ? found[1] : 0;
      }
      function mealContainsAnyIngredient(m, keysSet) {
        if (!m.ingredients) return false;
        return m.ingredients.some(([k]) => keysSet.has(k));
      }

      const WORK_SNACK_BLOCKED = new Set([
        "poulet_blanc",
        "dinde",
        "jambon_blanc",
        "fromage_rape",
        "fromage_frais_leger",
        "fromage_blanc",
        "lait",
        "oeuf",
        "blanc_oeuf",
      ]);
      // Odeur forte / gênant à manger devant des collègues — exclu des collations
      // même si la recette est par ailleurs transportable sans frigo.
      const SMELLY_SNACK_BLOCKED = new Set([
        "thon_boite",
        "sardine_boite",
        "maquereau",
      ]);
      const FAST_BREAKFAST_BLOCKED = new Set([
        "lentilles_crues",
        "riz_cru",
        "riz_complet_cru",
        "pates_cru",
        "pates_completes_cru",
        "quinoa_cru",
      ]);
      const PROTEIN_CATS = new Set([
        "volaille",
        "viande_rouge",
        "poisson_maigre",
        "poisson_gras",
        "oeuf",
        "laitier",
        "legumineuse",
        "charcuterie",
      ]);

      function estimatedPrepMinutes(m) {
        if (Number.isFinite(m.prep)) return m.prep;
        if (!m.ingredients)
          return m.moment === "petitdej" || m.moment.includes("collation")
            ? 10
            : 25;

        const keys = m.ingredients.map(([k]) => k);
        const hasLongCook = keys.includes("lentilles_crues");
        const hasCookedStarch = keys.some((k) =>
          [
            "riz_cru",
            "riz_complet_cru",
            "pates_cru",
            "pates_completes_cru",
            "quinoa_cru",
            "patate_douce",
            "pomme_de_terre",
          ].includes(k),
        );
        const hasRawProtein = keys.some((k) =>
          [
            "poulet_blanc",
            "dinde",
            "boeuf_hache_5",
            "boeuf_hache_15",
            "steak_hache",
            "saumon",
            "cabillaud",
            "truite",
            "crevettes",
            "oeuf",
            "blanc_oeuf",
          ].includes(k),
        );

        if (
          m.moment === "petitdej" ||
          m.moment === "collationmatin" ||
          m.moment === "collationapresmidi"
        ) {
          let t = 6 + m.ingredients.length;
          if (hasRawProtein) t += 4;
          if (hasCookedStarch) t += 4;
          if (hasLongCook) t += 10;
          return t;
        }

        // Parallel cooking: protein and starch cook simultaneously
        const starchTime = hasCookedStarch ? 16 : 0;
        const proteinTime = hasRawProtein ? 10 : 0;
        const longTime = hasLongCook ? 30 : 0;
        return (
          8 + m.ingredients.length + Math.max(starchTime, proteinTime, longTime)
        );
      }

      function isWorkSnackCompatible(m) {
        if (mealContainsAnyIngredient(m, SMELLY_SNACK_BLOCKED)) return false;
        if (m.workSnack) return true;
        if (!m.ingredients) return false;
        if (mealContainsIngredient(m, "whey")) return false;
        if (mealContainsAnyIngredient(m, WORK_SNACK_BLOCKED)) return false;
        return estimatedPrepMinutes(m) <= 15;
      }

      function dayDiversityMetrics(dayMeals) {
        const srcCounts = {};
        const proteinKeys = {};

        dayMeals.forEach((m) => {
          if (m.moment === "extra") return;
          srcCounts[m.src] = (srcCounts[m.src] || 0) + 1;
          if (!m.ingredients) return;
          m.ingredients.forEach(([k]) => {
            const cat = NUTRI[k] ? NUTRI[k].cat : null;
            if (!cat || !PROTEIN_CATS.has(cat)) return;
            proteinKeys[k] = (proteinKeys[k] || 0) + 1;
          });
        });

        const srcMax = Math.max(0, ...Object.values(srcCounts));
        const proteinVariety = Object.keys(proteinKeys).length;
        const proteinRepeatMax = Math.max(0, ...Object.values(proteinKeys));

        return { srcCounts, srcMax, proteinVariety, proteinRepeatMax };
      }

      let state = {
        profile: { weight: 62, height: 173, age: 25 },
        validated: STARTER_MEALS.map((m) => m.id),
        rejected: [],
        custom: [],
        plan: { lun: [], mar: [], mer: [], jeu: [], ven: [], sam: [], dim: [] },
        savedWeeks: [], // [{id, label, date, plan}]
        tab: "semaine",
        semaineView: "jours", // UI only — sous-onglet actif dans "Semaine": jours / courses / coherence / sauvegardes
        activeDay: "lun",
        suggestIdx: 0,
        weekMessage: "",
        generating: false,
        picker: null,
        recipeDetail: null, // UI only — id du repas affiché dans la popup "détail de la recette"
      };

      // window.storage n'existe que dans l'environnement Claude.ai. Si le
      // fichier est ouvert seul (téléchargé, hébergé ailleurs, ajouté à
      // l'écran d'accueil), on se rabat sur localStorage pour que la
      // sauvegarde fonctionne quand même d'une visite à l'autre.
      async function saveState() {
        const payload = JSON.stringify({
          profile: state.profile,
          validated: state.validated,
          rejected: state.rejected,
          custom: state.custom,
          plan: state.plan,
          savedWeeks: state.savedWeeks,
        });
        if (window.storage) {
          try {
            await window.storage.set("reserve-state", payload, false);
            return;
          } catch (e) {
            console.error("save failed (window.storage)", e);
          }
        }
        try {
          localStorage.setItem("reserve-state", payload);
        } catch (e) {
          console.error("save failed (localStorage)", e);
        }
      }
      async function loadState() {
        if (window.storage) {
          try {
            const r = await window.storage.get("reserve-state", false);
            if (r && r.value) {
              Object.assign(state, JSON.parse(r.value));
              render();
              return;
            }
          } catch (e) {
            /* rien sauvegardé côté Claude.ai — on tente localStorage */
          }
        }
        try {
          const raw = localStorage.getItem("reserve-state");
          if (raw) Object.assign(state, JSON.parse(raw));
        } catch (e) {
          /* rien sauvegardé */
        }
        render();
      }

      function allMeals() {
        return STARTER_MEALS.concat(state.custom);
      }
      function mealById(id) {
        return allMeals().find((m) => m.id === id);
      }
      function libraryMeals() {
        const starterIds = new Set(STARTER_MEALS.map((m) => m.id));
        return allMeals().filter(
          (m) => starterIds.has(m.id) || state.validated.includes(m.id),
        );
      }

      // Une entrée du planning est soit un id (string, portion normale ×1),
      // soit { id, scale } quand la portion a été réduite automatiquement
      // pour rentrer dans le quota calorique du jour.
      function entryId(e) {
        return typeof e === "string" ? e : e.id;
      }
      function entryScale(e) {
        return typeof e === "string" ? 1 : e.scale || 1;
      }
      function planDayMeals(dayKey, plan) {
        const list = (plan || state.plan)[dayKey] || [];
        return list
          .map((e) => {
            const meal = mealById(entryId(e));
            return meal ? { meal, scale: entryScale(e) } : null;
          })
          .filter(Boolean);
      }

      function computeTargets(training) {
        const { weight, height, age } = state.profile;
        const bmr = 10 * weight + 6.25 * height - 5 * age + 5;
        const maintenance = bmr * 1.3;
        const trainingBonus = training ? 380 : 0;
        const surplus = 420;
        const kcal = Math.round(maintenance + trainingBonus + surplus);
        const protein = Math.round(weight * 2);
        const fat = Math.round((kcal * 0.25) / 9);
        const carbs = Math.round((kcal - protein * 4 - fat * 9) / 4);
        return { kcal, protein, carbs, fat };
      }
      // Bornes kcal/jour utilisées à la fois pour la génération (ajustement
      // des portions) et pour le contrôle de cohérence hebdo.
      function dayKcalBounds(training, target) {
        return {
          min: target.kcal * 0.98,
          max: target.kcal * 1.1,
        };
      }

      function dayTotals(dayKey) {
        return planDayMeals(dayKey).reduce(
          (acc, { meal, scale }) => {
            const x = mac(meal, scale);
            return {
              kcal: acc.kcal + x.kcal,
              protein: acc.protein + x.protein,
              carbs: acc.carbs + x.carbs,
              fat: acc.fat + x.fat,
            };
          },
          { kcal: 0, protein: 0, carbs: 0, fat: 0 },
        );
      }

      function jarSvg(pct) {
        pct = Math.max(0, Math.min(1, pct));
        const fillY = 96 - pct * 80;
        const color =
          pct > 1.08
            ? "var(--brick)"
            : pct > 0.85
              ? "var(--green)"
              : "var(--amber)";
        return `<svg class="jar-svg" width="64" height="100" viewBox="0 0 64 100">
        <defs><clipPath id="jarclip"><path d="M14 20 L14 88 Q14 96 24 96 L40 96 Q50 96 50 88 L50 20 Z"/></clipPath></defs>
        <path d="M14 20 L14 88 Q14 96 24 96 L40 96 Q50 96 50 88 L50 20 Z" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
        <rect x="14" y="${fillY}" width="36" height="${96 - fillY}" fill="${color}" opacity="0.85" clip-path="url(#jarclip)"/>
        <rect x="20" y="8" width="24" height="14" rx="3" fill="var(--ink)"/>
      </svg>`;
      }

      function macrobar(label, val, target, color) {
        const pct = target ? Math.min(1.15, val / target) : 0;
        return `<div class="macrobar">
        <div class="mb-top"><span>${label}</span><span>${val}g / ${target}g</span></div>
        <div class="mb-track"><div class="mb-fill" style="width:${pct * 100}%; background:${color};"></div></div>
      </div>`;
      }

      function randomFrom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }
      // Tirage pondéré par rang: les meilleurs scores ont beaucoup plus de
      // chances d'être choisis, sans être systématiques (garde un peu
      // d'aléatoire pour la variété). Contrairement à un tirage uniforme,
      // ça permet aux bonus/pénalités de score (périssables, glucides...)
      // d'avoir un vrai effet sur le résultat final.
      function weightedPick(sortedArr) {
        const n = Math.min(sortedArr.length, 20);
        if (n === 0) return undefined;
        let total = 0;
        const weights = [];
        for (let i = 0; i < n; i++) {
          const w = Math.pow(0.9, i);
          weights.push(w);
          total += w;
        }
        let r = Math.random() * total;
        for (let i = 0; i < n; i++) {
          r -= weights[i];
          if (r <= 0) return sortedArr[i];
        }
        return sortedArr[n - 1];
      }

      const MAIN_INGREDIENT_CATS = new Set([
        "viande_rouge",
        "charcuterie",
        "volaille",
        "oeuf",
        "poisson_maigre",
        "poisson_gras",
        "legumineuse",
        "laitier",
        "feculent_complet",
        "feculent_raffine",
        "legume",
        "fruit",
      ]);

      function sortedOptionsForMoment(
        options,
        target,
        mealUsage,
        redMeatLeft,
        charcuterieLeft,
        selLeft,
        sucreLeft,
        thonLeft,
        cabillaudLeft,
        fatLeft,
        daySrcCounts,
        dayTechCounts,
        dayIngredientCounts,
        carbUsage,
        ingredientUsage,
        perishState,
        dayIndex,
        forbiddenId,
      ) {
        return options
          .slice()
          .map((m) => {
            const x = mac(m);
            const kcalFit =
              Math.abs(x.kcal - target.kcal) / Math.max(1, target.kcal);
            const proteinGap =
              Math.max(0, target.protein - x.protein) /
              Math.max(1, target.protein);
            // Dépasser un peu les protéines ne pose pas de souci, mais un
            // excès important n'aide pas non plus — frein au-delà de 115%.
            const proteinOver =
              Math.max(0, x.protein - target.protein * 1.15) /
              Math.max(1, target.protein);
            const fatOver =
              Math.max(0, x.fat - target.fat) / Math.max(1, target.fat);
            const reusePenalty = Math.pow(mealUsage[m.id] || 0, 1.6) * 1.1;
            const sameSrcCount = daySrcCounts[m.src] || 0;
            const sameTechCount =
              dayTechCounts && m.technique
                ? dayTechCounts[m.technique] || 0
                : 0;
            // Pénalité dès la 1ère répétition de la même source (protéine)
            // ou de la même technique de préparation le même jour, pour
            // éviter des recettes trop similaires côte à côte.
            const sameSrcPenalty =
              sameSrcCount > 0
                ? sameSrcCount * 1.9 + (sameSrcCount >= 2 ? 3 : 0)
                : 0;
            const sameTechPenalty = sameTechCount * 0.7;
            const red = categoryGrams(m, "viande_rouge");
            const charc = categoryGrams(m, "charcuterie");
            const sel = mealSelGrams(m);
            const sucre = mealSucreGrams(m);
            const thonGrams = ingredientGrams(m, "thon_boite");
            const isCabillaud = mealContainsIngredient(m, "cabillaud");
            const containsPainComplet = mealContainsIngredient(
              m,
              "pain_complet",
            );
            // Pénalité douce sur une source de glucides déjà beaucoup utilisée
            // cette semaine (riz, pâtes...), pour favoriser la rotation avec
            // patate douce / pomme de terre / quinoa déjà présents.
            const carbKeys = m.ingredients
              ? m.ingredients
                  .filter(
                    ([k]) =>
                      NUTRI[k] &&
                      (NUTRI[k].cat === "feculent_complet" ||
                        NUTRI[k].cat === "feculent_raffine"),
                  )
                  .map(([k]) => k)
              : [];
            const carbRepeatPenalty = carbKeys.reduce(
              (s, k) => s + Math.max(0, (carbUsage[k] || 0) - 1) * 1.6,
              0,
            );
            // Pénalité générale : décourage un même ingrédient principal
            // (viande, légume, laitier...) de revenir trop souvent sur la
            // semaine entière, même s'il n'est jamais interdit par ailleurs.
            const mainKeys = m.ingredients
              ? m.ingredients
                  .filter(
                    ([k]) => NUTRI[k] && MAIN_INGREDIENT_CATS.has(NUTRI[k].cat),
                  )
                  .map(([k]) => k)
              : [];
            const ingredientRepeatPenalty = mainKeys.reduce(
              (s, k) =>
                s +
                Math.pow(Math.max(0, (ingredientUsage[k] || 0) - 1), 1.6) * 1.8,
              0,
            );
            const fruitCapPenalty = mainKeys.some(
              (k) =>
                NUTRI[k].cat === "fruit" &&
                (ingredientUsage[k] || 0) >= FRUIT_INGREDIENT_MAX_WEEKLY,
            )
              ? 6
              : 0;
            const dayIngredientRepeatPenalty = mainKeys.reduce(
              (s, k) => s + (dayIngredientCounts[k] || 0) * 3.5,
              0,
            );
            // Rééquilibrage poulet / dinde : si le poulet a déjà été
            // nettement plus utilisé que la dinde cette semaine, on le
            // pénalise un peu plus pour ramener les deux au même niveau.
            const poultryImbalancePenalty = mealContainsIngredient(
              m,
              "poulet_blanc",
            )
              ? Math.min(
                  3,
                  Math.max(
                    0,
                    (ingredientUsage["poulet_blanc"] || 0) -
                      (ingredientUsage["dinde"] || 0),
                  ),
                ) * 2.5
              : 0;
            // Périssables déjà ouverts cette semaine (lait, crème fraîche...) :
            // on encourage fortement à réutiliser un pot déjà entamé tant qu'il
            // est encore bon, pour ne pas en ouvrir un nouveau inutilement ni
            // en laisser traîner un qui va se perdre.
            let perishBonus = 0;
            if (m.ingredients && perishState) {
              m.ingredients.forEach(([key]) => {
                const pkg = CONSERVATION_PACKAGES[key];
                if (!pkg || pkg.days > SHELF_LIFE_SOON_THRESHOLD) return;
                const openedDay = perishState[key];
                let thisBonus = 0;
                if (openedDay === undefined) {
                  thisBonus = -Math.max(0, DAYS.length - 1 - dayIndex) * 0.22;
                } else {
                  const age = dayIndex - openedDay;
                  if (age >= 0 && age <= pkg.days) thisBonus = -3.5;
                }
                perishBonus = Math.min(perishBonus, thisBonus);
              });
            }
            const oatSoftPenalty = mealContainsIngredient(m, "avoine")
              ? 1.5
              : 0;
            // Pénalité douce anti-concentration : décourage de "dépenser"
            // trop vite le quota hebdo de viande rouge par rapport à
            // l'avancement de la semaine, pour éviter qu'elle se retrouve
            // systématiquement en début de semaine.
            const weekProgress = (dayIndex + 1) / DAYS.length;
            const redMeatSoFarComputed = RED_MEAT_SAFE - redMeatLeft;
            const redPaceOver = Math.max(
              0,
              redMeatSoFarComputed + red - RED_MEAT_SAFE * weekProgress,
            );
            const redPacePenalty =
              (redPaceOver / Math.max(1, RED_MEAT_SAFE)) * 5;
            const selSoFarComputed = SEL_SAFE - selLeft;
            const selPaceOver = Math.max(
              0,
              selSoFarComputed + sel - SEL_SAFE * weekProgress,
            );
            const selPacePenalty = (selPaceOver / Math.max(1, SEL_SAFE)) * 4;
            const hardPenalty =
              (red > redMeatLeft ? 4 : 0) +
              (charc > charcuterieLeft ? 4 : 0) +
              (sel > selLeft ? 3 : 0) +
              (sucre > sucreLeft ? 3 : 0) +
              (thonGrams > thonLeft ? 4 : 0) +
              (isCabillaud && cabillaudLeft <= 0 ? 4 : 0) +
              (x.fat > fatLeft ? 3 : 0) +
              (containsPainComplet &&
              (dayIngredientCounts["pain_complet"] || 0) >= 1
                ? 8
                : 0) +
              ((mealUsage[m.id] || 0) >= 3 ? 6 : 0) +
              (forbiddenId && m.id === forbiddenId ? 50 : 0) +
              fruitCapPenalty +
              sameSrcPenalty;
            return {
              meal: m,
              score:
                kcalFit * 2 +
                proteinGap * 1.4 +
                proteinOver * 3 +
                fatOver * 4 +
                reusePenalty +
                carbRepeatPenalty +
                ingredientRepeatPenalty +
                dayIngredientRepeatPenalty + // AJOUT
                poultryImbalancePenalty +
                perishBonus +
                hardPenalty +
                sameTechPenalty +
                oatSoftPenalty +
                redPacePenalty,
              selPacePenalty,
            };
          })
          .sort((a, b) => a.score - b.score)
          .map((x) => x.meal);
      }

      // Marge de sécurité: on ne vise jamais pile le plafond officiel
      // (PNNS 5 etc.), pour laisser une vraie marge plutôt que de coller au
      // maximum autorisé chaque semaine.
      const HEALTH_SAFETY_MARGIN = 0.88;
      const RED_MEAT_MAX = 500; // g/semaine, PNNS 5
      const CHARCUTERIE_MAX = 150; // g/semaine, PNNS 5
      const FRUIT_INGREDIENT_MAX_WEEKLY = 7; // occurrences max d'un même fruit par semaine
      const RED_MEAT_SAFE = Math.round(RED_MEAT_MAX * HEALTH_SAFETY_MARGIN);
      const CHARCUTERIE_SAFE = Math.round(
        CHARCUTERIE_MAX * HEALTH_SAFETY_MARGIN,
      );
      const SEL_MAX = 35; // g/semaine — 5g/jour recommandé ANSES/PNNS 5 (mangerbouger.fr)
      const SEL_SAFE = Math.round(SEL_MAX * HEALTH_SAFETY_MARGIN);

      const SUCRE_MAX = 350; // g/semaine — 50g/jour, sucres libres max recommandé OMS (10% de l'apport énergétique)
      const SUCRE_SAFE = Math.round(SUCRE_MAX * HEALTH_SAFETY_MARGIN);

      const NON_BLOCKING_RULE_KEYS = new Set([
        "dailyKcal",
        "dailyProtein",
        "perishCluster",
      ]);
      function weekStats(plan) {
        const allEntries = Object.values(plan)
          .flat()
          .map((e) => {
            const id = entryId(e);
            const meal = mealById(id);
            return meal ? { id, scale: entryScale(e), meal } : null;
          })
          .filter(Boolean);
        const meals = allEntries.map((e) => e.meal);
        const counts = {};
        allEntries.forEach(({ id, meal }) => {
          if (meal.moment === "extra") return;
          counts[id] = (counts[id] || 0) + 1;
        });
        const repeatedMeals = Object.entries(counts)
          .filter(([, c]) => c > 2)
          .map(([id]) => mealById(id))
          .filter(Boolean);

        const weeklyCatGrams = (cat) =>
          allEntries.reduce(
            (s, { meal, scale }) => s + categoryGrams(meal, cat, scale),
            0,
          );
        const weeklyMealsWithCat = (cats) =>
          meals.filter((m) => mealHasCategory(m, cats)).length;

        const legFruitGrams =
          weeklyCatGrams("legume") + weeklyCatGrams("fruit");
        const legFruitTarget = 7 * 5 * 80;
        const legFruitPct = Math.round(
          (legFruitGrams / Math.max(1, legFruitTarget)) * 100,
        );

        const legumineuseCount = weeklyMealsWithCat(["legumineuse"]);
        const poissonCount = weeklyMealsWithCat([
          "poisson_maigre",
          "poisson_gras",
        ]);
        const oilyFishCount = weeklyMealsWithCat(["poisson_gras"]);
        const thonGramsWeek = meals.reduce(
          (s, m) => s + ingredientGrams(m, "thon_boite"),
          0,
        );
        const thonCount = meals.filter((m) =>
          mealContainsIngredient(m, "thon_boite"),
        ).length;
        const cabillaudCount = meals.filter((m) =>
          mealContainsIngredient(m, "cabillaud"),
        ).length;
        // Regroupement des périssables : une fois un pot/brique ouvert (lait,
        // houmous, crème fraîche...), toutes ses utilisations dans la semaine
        // doivent tenir dans sa durée de conservation, pour ne rien gâcher.
        const perishDaysUsed = {};
        DAYS.forEach((d, di) => {
          (plan[d.key] || []).forEach((e) => {
            const meal = mealById(entryId(e));
            if (!meal || !meal.ingredients) return;
            meal.ingredients.forEach(([k]) => {
              if (CONSERVATION_PACKAGES[k]) {
                (perishDaysUsed[k] = perishDaysUsed[k] || []).push(di);
              }
            });
          });
        });
        const perishViolations = Object.keys(perishDaysUsed).filter((k) => {
          const days = perishDaysUsed[k];
          if (days.length < 2) return false;
          const span = Math.max(...days) - Math.min(...days);
          return span > CONSERVATION_PACKAGES[k].days;
        });
        const redMeatGrams = weeklyCatGrams("viande_rouge");
        const charcuterieGrams = weeklyCatGrams("charcuterie");
        const selGrams = allEntries.reduce(
          (s, { meal, scale }) => s + mealSelGrams(meal, scale),
          0,
        );

        const sucreGrams = allEntries.reduce(
          (s, { meal, scale }) => s + mealSucreGrams(meal, scale),
          0,
        );

        const dairyCount = weeklyMealsWithCat(["laitier"]);
        const completGrams = weeklyCatGrams("feculent_complet");
        const raffineGrams = weeklyCatGrams("feculent_raffine");
        const completPct =
          completGrams + raffineGrams
            ? Math.round((completGrams / (completGrams + raffineGrams)) * 100)
            : 0;

        const weekFatTotal = DAYS.reduce(
          (s, d) => s + dayTotalsFromPlan(plan, d.key).fat,
          0,
        );
        const weekFatTarget = DAYS.reduce(
          (s, d) => s + computeTargets(d.training).fat,
          0,
        );
        const fatRatio = weekFatTarget ? weekFatTotal / weekFatTarget : 0;

        const varietyCount = new Set(meals.map((m) => m.src)).size;

        const dailySummaries = DAYS.map((d) => {
          const dayMeals = planDayMeals(d.key, plan).map((e) => e.meal);
          const totals = dayTotalsFromPlan(plan, d.key);
          const target = computeTargets(d.training);
          const diversity = dayDiversityMetrics(dayMeals);
          const { min: kcalMin, max: kcalMax } = dayKcalBounds(
            d.training,
            target,
          );
          return {
            key: d.key,
            training: d.training,
            totals,
            target,
            kcalOk: totals.kcal >= kcalMin && totals.kcal <= kcalMax,
            proteinOk: totals.protein >= target.protein * 0.9,
            diversityOk:
              diversity.srcMax <= 2 &&
              diversity.proteinVariety >= 3 &&
              diversity.proteinRepeatMax <= 3,
          };
        });

        const trainingDays = dailySummaries.filter((d) => d.training);
        const trainingKcalAvg = trainingDays.length
          ? Math.round(
              trainingDays.reduce((s, d) => s + d.totals.kcal, 0) /
                trainingDays.length,
            )
          : 0;
        const trainingTargetAvg = trainingDays.length
          ? Math.round(
              trainingDays.reduce((s, d) => s + d.target.kcal, 0) /
                trainingDays.length,
            )
          : 0;

        const prepLimitsOk = meals.every((m) => {
          const t = estimatedPrepMinutes(m);
          if (m.moment === "petitdej" || m.moment.includes("collation"))
            return t <= 15;
          return t <= 35;
        });
        const workSnackOk = Object.entries(plan).every(([dayKey, entries]) => {
          const day = DAYS.find((d) => d.key === dayKey);
          if (!day || !day.workday) return true;
          return entries
            .map((e) => mealById(entryId(e)))
            .filter(
              (m) =>
                m &&
                (m.moment === "collationmatin" ||
                  m.moment === "collationapresmidi"),
            )
            .every((m) => isWorkSnackCompatible(m));
        });
        const wheyFree = meals.every((m) => !mealContainsIngredient(m, "whey"));

        const fruitKeysInLibrary = Object.keys(NUTRI).filter(
          (k) => NUTRI[k].cat === "fruit",
        );
        const fruitOveruse = fruitKeysInLibrary.filter(
          (k) =>
            meals.filter((m) => mealContainsIngredient(m, k)).length >
            FRUIT_INGREDIENT_MAX_WEEKLY,
        );

        const rules = {
          legFruit: legFruitPct >= 80,
          legumineuses: legumineuseCount >= 2,
          poisson: poissonCount >= 2,
          oilyFish: oilyFishCount >= 1,
          thonLimit: thonGramsWeek <= INGREDIENT_UNITS.thon_boite.unitG,
          cabillaudLimit: cabillaudCount <= 1,
          fruitVariety: fruitOveruse.length === 0,
          perishCluster: perishViolations.length === 0,
          redMeat: redMeatGrams <= RED_MEAT_SAFE,
          charcuterie: charcuterieGrams <= CHARCUTERIE_SAFE,
          sel: selGrams <= SEL_SAFE,
          sucre: sucreGrams <= SUCRE_SAFE,
          dairy: dairyCount >= 10,
          complet: completPct >= 50,
          fat: fatRatio <= 1.1,
          variety: varietyCount >= 4,
          repetition: repeatedMeals.length === 0,
          // dailyKcal/dailyProtein: display warnings only, not blocking constraints
          dailyKcal: dailySummaries.every((d) => d.kcalOk),
          dailyProtein: dailySummaries.every((d) => d.proteinOk),
          dailyDiversity: dailySummaries.every((d) => d.diversityOk),
          prepTime: prepLimitsOk,
          workSnack: workSnackOk,
          wheyFree,
        };

        return {
          meals,
          counts,
          repeatedMeals,
          legFruitGrams,
          legFruitPct,
          legFruitTarget,
          legumineuseCount,
          poissonCount,
          oilyFishCount,
          thonCount,
          cabillaudCount,
          fruitOveruse,
          perishViolations,
          redMeatGrams,
          charcuterieGrams,
          selGrams,
          sucreGrams,
          dairyCount,
          completPct,
          weekFatTotal,
          weekFatTarget,
          fatRatio,
          varietyCount,
          dailySummaries,
          trainingKcalAvg,
          trainingTargetAvg,
          rules,
          // dailyKcal/dailyProtein/perishCluster: display warnings only, not blocking constraints
          allRulesOk: Object.entries(rules)
            .filter(([k]) => !NON_BLOCKING_RULE_KEYS.has(k))
            .every(([, v]) => v),
        };
      }

      function dayTotalsFromPlan(plan, dayKey) {
        return planDayMeals(dayKey, plan).reduce(
          (acc, { meal, scale }) => {
            const x = mac(meal, scale);
            return {
              kcal: acc.kcal + x.kcal,
              protein: acc.protein + x.protein,
              carbs: acc.carbs + x.carbs,
              fat: acc.fat + x.fat,
            };
          },
          { kcal: 0, protein: 0, carbs: 0, fat: 0 },
        );
      }

      function generateWeek() {
        const lib = libraryMeals();
        if (lib.length < 5) return;
        const allMomentShares = Object.assign(
          {},
          MOMENT_SHARE,
          MOMENT_SHARE_TRAINING,
        );
        const byMoment = {};
        const byMomentWorkSnack = {};
        Object.keys(allMomentShares).forEach((mo) => {
          let options = lib.filter((m) => m.moment === mo);
          options = options.filter((m) => !mealContainsIngredient(m, "whey"));
          options = options.filter((m) => {
            const t = estimatedPrepMinutes(m);
            if (
              mo === "petitdej" ||
              mo.includes("collation") ||
              mo === "postworkout"
            )
              return t <= 15;
            return t <= 35;
          });
          options = options.filter((m) => {
            if (!m.ingredients) return true;
            const fruitCount = m.ingredients.filter(
              ([k]) => NUTRI[k] && NUTRI[k].cat === "fruit",
            ).length;
            return fruitCount <= 1;
          });
          byMoment[mo] = options;
          if (mo === "collationmatin" || mo === "collationapresmidi") {
            byMomentWorkSnack[mo] = options.filter((m) =>
              isWorkSnackCompatible(m),
            );
          }
        });
        // Check coverage only for base moments (postworkout is training-only)
        const baseMoments = Object.keys(MOMENT_SHARE);
        const missingMoments = baseMoments.filter(
          (mo) => !byMoment[mo] || byMoment[mo].length === 0,
        );
        const missingTrainingMoments = Object.keys(
          MOMENT_SHARE_TRAINING,
        ).filter((mo) => !byMoment[mo] || byMoment[mo].length === 0);
        const missingWorkSnackMoments = [
          "collationmatin",
          "collationapresmidi",
        ].filter(
          (mo) => !byMomentWorkSnack[mo] || byMomentWorkSnack[mo].length === 0,
        );
        if (missingMoments.length) {
          state.weekMessage =
            "Impossible de générer: il manque des recettes pour " +
            missingMoments.map((m) => MOMENT_LABEL[m]).join(", ") +
            " après application des contraintes (sans whey, préparation rapide, collations transportables sans frigo).";
          render();
          return;
        }
        if (missingTrainingMoments.length) {
          state.weekMessage =
            "Impossible de générer: il manque des recettes pour les moments d’entraînement: " +
            missingTrainingMoments.map((m) => MOMENT_LABEL[m]).join(", ");
          render();
          return;
        }
        if (missingWorkSnackMoments.length) {
          state.weekMessage =
            "Impossible de générer: aucune collation compatible boulot (sans frigo, sans odeur, stable à température ambiante) pour " +
            missingWorkSnackMoments.map((m) => MOMENT_LABEL[m]).join(", ") +
            ".";
          render();
          return;
        }

        const TIME_BUDGET_MS = 20000;
        const startTime = performance.now();
        const ruleFailCounts = {};
        const weekFatTargetPreCalc = DAYS.reduce(
          (s, d) => s + computeTargets(d.training).fat,
          0,
        );
        const FAT_SAFE = weekFatTargetPreCalc * 1.1;
        let attempt = 0;
        while (performance.now() - startTime < TIME_BUDGET_MS) {
          attempt++;
          const mealUsage = {};
          const prevDayMainMeals = {}; // dernière recette utilisée la veille, par moment structurant
          let redMeatSoFar = 0;
          let fatSoFar = 0;
          let charcuterieSoFar = 0;
          let selSoFar = 0;
          let sucreSoFar = 0;
          let thonGramsSoFar = 0;
          let cabillaudSoFar = 0;
          let scaledDaysCount = 0;
          const carbUsage = {};
          const ingredientUsage = {};
          const perishState = {}; // clé périssable -> index du jour où ouvert la 1ère fois
          const newPlan = {};
          let failed = false;

          for (const day of DAYS) {
            const dayTarget = computeTargets(day.training);
            const dayMomentShare = day.training
              ? MOMENT_SHARE_TRAINING
              : MOMENT_SHARE;
            const moments = Object.keys(dayMomentShare);
            const dayMeals = [];
            const daySrcCounts = {};
            const dayTechCounts = {};
            const dayIngredientCounts = {}; // AJOUT
            const dayIndex = DAYS.indexOf(day);

            for (const moment of moments) {
              const subTarget = {
                kcal: dayTarget.kcal * dayMomentShare[moment],
                protein: dayTarget.protein * dayMomentShare[moment],
                fat: dayTarget.fat * dayMomentShare[moment],
              };
              const isWorkCollation =
                (moment === "collationmatin" ||
                  moment === "collationapresmidi") &&
                day.workday;
              const momentPool = isWorkCollation
                ? byMomentWorkSnack[moment]
                : byMoment[moment];
              const ordered = sortedOptionsForMoment(
                momentPool,
                subTarget,
                mealUsage,
                RED_MEAT_SAFE - redMeatSoFar,
                CHARCUTERIE_SAFE - charcuterieSoFar,
                SEL_SAFE - selSoFar,
                SUCRE_SAFE - sucreSoFar,
                INGREDIENT_UNITS.thon_boite.unitG - thonGramsSoFar,
                1 - cabillaudSoFar,
                FAT_SAFE - fatSoFar,
                daySrcCounts,
                dayTechCounts,
                dayIngredientCounts,
                carbUsage,
                ingredientUsage,
                perishState,
                dayIndex,
                MAIN_MOMENTS.has(moment) ? prevDayMainMeals[moment] : undefined,
              );
              const selected = weightedPick(ordered);
              if (!selected) {
                failed = true;
                break;
              }
              dayMeals.push(selected);
              mealUsage[selected.id] = (mealUsage[selected.id] || 0) + 1;
              if (MAIN_MOMENTS.has(moment)) {
                prevDayMainMeals[moment] = selected.id;
              }
              daySrcCounts[selected.src] =
                (daySrcCounts[selected.src] || 0) + 1;
              if (selected.technique)
                dayTechCounts[selected.technique] =
                  (dayTechCounts[selected.technique] || 0) + 1;
              redMeatSoFar += categoryGrams(selected, "viande_rouge");
              charcuterieSoFar += categoryGrams(selected, "charcuterie");
              selSoFar += mealSelGrams(selected);
              sucreSoFar += mealSucreGrams(selected);
              thonGramsSoFar += ingredientGrams(selected, "thon_boite");
              if (mealContainsIngredient(selected, "cabillaud"))
                cabillaudSoFar++;
              cabillaudSoFar++;
              fatSoFar += mac(selected).fat;
              if (selected.ingredients) {
                selected.ingredients.forEach(([k]) => {
                  if (
                    NUTRI[k] &&
                    (NUTRI[k].cat === "feculent_complet" ||
                      NUTRI[k].cat === "feculent_raffine")
                  ) {
                    carbUsage[k] = (carbUsage[k] || 0) + 1;
                  }
                  if (NUTRI[k] && MAIN_INGREDIENT_CATS.has(NUTRI[k].cat)) {
                    ingredientUsage[k] = (ingredientUsage[k] || 0) + 1;
                    dayIngredientCounts[k] = (dayIngredientCounts[k] || 0) + 1; // AJOUT
                  }
                  if (
                    CONSERVATION_PACKAGES[k] &&
                    perishState[k] === undefined
                  ) {
                    perishState[k] = dayIndex;
                  }
                });
              }
            }

            if (failed) break;

            // Si le jour est trop loin du quota calorique (trop haut ou trop
            // bas), on ajuste les quantités de féculents (en priorité) —
            // jamais les portions de viande/poisson/œuf, qui restent fixes.
            // On préfère toujours atteindre complètement le quota, quitte à
            // dépasser légèrement, plutôt que de rester en dessous.
            const bounds = dayKcalBounds(day.training, dayTarget);
            const rawKcal = dayMeals.reduce((s, m) => s + mac(m).kcal, 0);
            let dayScale = 1;
            if (rawKcal > bounds.max || rawKcal < dayTarget.kcal) {
              const scalableKcalPool = dayMeals.reduce((s, m) => {
                if (!m.ingredients) return s;
                const cats = mealScalableCats(m);
                return (
                  s +
                  m.ingredients.reduce((s2, [key, g]) => {
                    const n = NUTRI[key];
                    if (n && cats.has(n.cat)) return s2 + (n.kcal * g) / 100;
                    return s2;
                  }, 0)
                );
              }, 0);
              if (scalableKcalPool > 0) {
                // Vise 102% du quota plutôt que pile dessus, pour que
                // l'arrondi ne fasse jamais retomber en dessous.
                const desiredScalableKcal =
                  scalableKcalPool + (dayTarget.kcal * 1.02 - rawKcal);
                dayScale = Math.max(
                  0.5,
                  Math.min(1.8, desiredScalableKcal / scalableKcalPool),
                );
                dayScale = Math.round(dayScale * 100) / 100;
              }
            }
            if (dayScale !== 1) scaledDaysCount++;

            newPlan[day.key] = dayMeals.map((m) =>
              m.ingredients && dayScale !== 1
                ? { id: m.id, scale: dayScale }
                : m.id,
            );

            // Un périssable déjà ouvert plus tôt cette semaine (lait, houmous,
            // fromage frais...) mais pas utilisé aujourd'hui, alors qu'il est
            // encore dans sa fenêtre de conservation : on ajoute un en-cas
            // ultra-rapide (pas un vrai repas) pour aider à le finir à temps.
            const usedTodayKeys = new Set();
            dayMeals.forEach((m) => {
              if (m.ingredients)
                m.ingredients.forEach(([k]) => usedTodayKeys.add(k));
            });
            for (const [perishKey, extraId] of Object.entries(
              PERISH_QUICK_EXTRA,
            )) {
              const openedDay = perishState[perishKey];
              if (openedDay === undefined || openedDay === dayIndex) continue;
              if (usedTodayKeys.has(perishKey)) continue;
              const pkg = CONSERVATION_PACKAGES[perishKey];
              const age = dayIndex - openedDay;
              if (age > pkg.days) continue;
              if (!mealById(extraId)) continue;
              newPlan[day.key].push(extraId);
              break;
            }
          }

          if (failed) continue;
          const stats = weekStats(newPlan);
          if (!stats.allRulesOk) {
            Object.entries(stats.rules).forEach(([k, ok]) => {
              if (!ok && !NON_BLOCKING_RULE_KEYS.has(k)) {
                ruleFailCounts[k] = (ruleFailCounts[k] || 0) + 1;
              }
            });
            continue;
          }

          state.plan = newPlan;
          state.weekMessage = scaledDaysCount
            ? `Semaine générée: 100% des règles nutritionnelles codées sont respectées. Quantités de féculents/légumes ajustées sur ${scaledDaysCount} jour(s) pour bien coller au quota (portions de viande/poisson/œuf inchangées).`
            : "Semaine générée: 100% des règles nutritionnelles codées sont respectées.";
          saveState();
          render();
          return;
        }

        const RULE_LABELS = {
          legFruit: "légumes/fruits (80% du repère)",
          legumineuses: "légumineuses (min 2/sem)",
          poisson: "poisson (min 2/sem)",
          oilyFish: "poisson gras (min 1/sem)",
          thonLimit: "thon (max 1 boîte/sem)",
          cabillaudLimit: "cabillaud (max 1/sem)",
          fruitVariety: "variété des fruits (max 7x/sem par fruit)",
          redMeat: "viande rouge (quota)",
          charcuterie: "charcuterie (quota)",
          sel: "sel (quota)",
          sucre: "sucre (quota)",
          dairy: "laitiers (min 10/sem)",
          complet: "féculents complets (50%)",
          fat: "lipides (quota)",
          variety: "variété des recettes",
          repetition: "répétition des repas",
          dailyDiversity:
            "diversité protéique quotidienne (3 sources mini/jour)",
          prepTime: "temps de préparation",
          workSnack: "compatibilité collations au travail",
          wheyFree: "whey exclue",
        };
        console.log(
          `Génération arrêtée après ${attempt} tentatives en ${Math.round(performance.now() - startTime)}ms.`,
        );
        const topFails = Object.entries(ruleFailCounts)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 3)
          .map(([k]) => RULE_LABELS[k] || k);
        state.weekMessage = topFails.length
          ? `Aucun plan ne respecte toutes les contraintes avec la bibliothèque actuelle. Règle la plus souvent bloquante : ${topFails.join(", ")}. Ajoute des recettes qui aident sur ce point précis, ou assouplis cette règle.`
          : "Aucun plan ne respecte toutes les contraintes avec la bibliothèque actuelle. Ajoute plus de recettes variées.";
        render();
      }

      function render() {
        const app = document.getElementById("app");
        app.innerHTML = `
        <header class="top">
          <div class="eyebrow">Réserve</div>
          <h1>${tabTitle()}</h1>
        </header>
        <main>${renderTab()}</main>
        <nav class="tabs">
          ${tabBtn("profil", "◐", "Profil")}
          ${tabBtn("bib", "◧", "Bibliothèque")}
          ${tabBtn("semaine", "▦", "Semaine")}
        </nav>
        ${state.picker ? renderPicker() : ""}
        ${state.recipeDetail ? renderRecipeDetailModal() : ""}
      `;
        bindEvents();
      }

      function tabTitle() {
        return { profil: "Ton quota", bib: "Tes repas", semaine: "Ta semaine" }[
          state.tab
        ];
      }
      function tabBtn(key, ico, label) {
        return `<button data-tab="${key}" class="${state.tab === key ? "active" : ""}"><span class="ico">${ico}</span>${label}</button>`;
      }

      function renderTab() {
        if (state.tab === "profil") return renderProfil();
        if (state.tab === "bib") return renderBib();
        if (state.tab === "semaine") return renderSemaine();
      }

      function renderProfil() {
        const t = computeTargets(true);
        const r = computeTargets(false);
        return `
        <div class="card">
          <h2>Ton profil</h2>
          <div class="row">
            <div class="field"><label>Poids (kg)</label><input type="number" id="p-weight" value="${state.profile.weight}"></div>
            <div class="field"><label>Taille (cm)</label><input type="number" id="p-height" value="${state.profile.height}"></div>
            <div class="field"><label>Âge</label><input type="number" id="p-age" value="${state.profile.age}"></div>
          </div>
        </div>
        <div class="card">
          <h2>Jour d'entraînement <span class="pill">${t.kcal} kcal</span></h2>
          ${macrobar("Protéines", 0, r.protein, "var(--protein)")}
          ${macrobar("Glucides", 0, r.carbs, "var(--carbs)")}
          ${macrobar("Lipides", 0, r.fat, "var(--fat)")}
        </div>
        <div class="card">
          <h2>Jour de repos <span class="pill amber">${r.kcal} kcal</span></h2>
          ${macrobar("Protéines", 0, r.protein, "var(--protein)")}
          ${macrobar("Glucides", 0, r.carbs, "var(--carbs)")}
          ${macrobar("Lipides", 0, r.fat, "var(--fat)")}
        </div>
        <div class="card">
          <h2>Comment c'est calculé</h2>
          <p style="font-size:13px;color:var(--ink-soft);line-height:1.55;margin:0;">
          Métabolisme de base (Mifflin-St Jeor) × activité sédentaire, + un bonus les jours de muscu, + un surplus modéré pour la prise de masse. Protéines calées à 2g/kg. Ajuste ton poids ici chaque semaine pour garder les cibles justes.
          </p>
        </div>
      `;
      }

      function renderBib() {
        const validatedMeals = libraryMeals();
        let html = "";

        html += `<div class="card">
        <h2>Tes recettes</h2>
        <p style="font-size:13px;color:var(--ink-soft);line-height:1.5;margin:0;">
          Toutes les recettes sont disponibles automatiquement pour la génération de ta semaine.
          Tu n'as plus besoin de les valider une par une.
        </p>
      </div>`;

        html += `<div class="section-title">Tes repas disponibles (${validatedMeals.length})</div>`;
        if (validatedMeals.length === 0) {
          html += `<div class="empty"><div class="glyph">◧</div><p>Aucune recette disponible.</p></div>`;
        } else {
          html +=
            `<div class="card">` +
            validatedMeals
              .map(
                (m) => `
          <div class="meal-row-full" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <div style="flex:1;min-width:0;">
              <div class="mname">${m.name}</div>
              <div class="mmacro">${MOMENT_LABEL[m.moment]} · ${mac(m).kcal} kcal · ${mac(m).protein}P/${mac(m).carbs}G/${mac(m).fat}L</div>
              ${m.ingredients ? `<div class="ingr-chips">${ingredientLine(m)}</div>` : ""}
            </div>
            <button class="rm-info" data-view-recipe="${m.id}">🍳</button>
          </div>`,
              )
              .join("") +
            `</div>`;
        }

        html += `<div class="section-title">Ajouter ton propre repas</div>
        <div class="card">
          <div class="row">
            <div class="field" style="flex:2"><label>Nom</label><input type="number" style="display:none">
              <input type="text" id="c-name" placeholder="Ex : Poêlée de dinde, quinoa" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 10px;font-size:14px;background:var(--bg);color:var(--ink);">
            </div>
          </div>
          <div class="row" style="margin-top:10px;">
            <div class="field"><label>Kcal</label><input type="number" id="c-kcal" value="600"></div>
            <div class="field"><label>Protéines</label><input type="number" id="c-protein" value="35"></div>
          </div>
          <div class="row" style="margin-top:10px;">
            <div class="field"><label>Glucides</label><input type="number" id="c-carbs" value="55"></div>
            <div class="field"><label>Lipides</label><input type="number" id="c-fat" value="20"></div>
          </div>
          <div style="margin-top:12px;"><button class="primary" id="add-custom" style="width:100%;">Ajouter à ma bibliothèque</button></div>
        </div>`;
        return html;
      }

      function renderSemaine() {
        if (state.generating) {
          return `<style>@keyframes reserve-spin{to{transform:rotate(360deg);}}</style>
        <div class="card" style="text-align:center;padding:48px 16px;">
          <div style="width:34px;height:34px;margin:0 auto 16px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:reserve-spin .8s linear infinite;"></div>
          <div style="font-family:'Fraunces',serif;font-size:15px;font-weight:600;">Génération de la semaine…</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">Recherche du meilleur plan parmi des milliers de combinaisons.</div>
        </div>`;
        }
        const lib = libraryMeals();
        const allMoments = [
          ...new Set([
            ...Object.keys(MOMENT_SHARE),
            ...Object.keys(MOMENT_SHARE_TRAINING),
          ]),
        ];
        const thinMoments = allMoments.filter(
          (mo) => lib.filter((m) => m.moment === mo).length < 2,
        );
        const stats = weekStats(state.plan);
        const hasAnyMeals = Object.values(state.plan).some(
          (ids) => ids.length > 0,
        );
        const blockingRuleEntries = Object.entries(stats.rules).filter(
          ([k]) => !NON_BLOCKING_RULE_KEYS.has(k),
        );
        const rulesOk = blockingRuleEntries.filter(([, v]) => v).length;
        const rulesTotal = blockingRuleEntries.length;
        const view = state.semaineView || "jours";

        let html = "";

        // ── Carte principale ──
        html += `<div class="card">
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;">
          <div style="flex:1;min-width:0;">
            <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:600;line-height:1.2;">Planifier ma semaine</div>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:3px;">${lib.length} recettes disponibles</div>
          </div>
          ${hasAnyMeals ? `<span class="pill ${stats.allRulesOk ? "" : "amber"}" style="flex-shrink:0;">${stats.allRulesOk ? "✓" : "▲"} ${rulesOk}/${rulesTotal}</span>` : ""}
        </div>
        ${thinMoments.length ? `<p style="font-size:12px;color:var(--amber);margin:0 0 10px;line-height:1.4;">Peu de recettes pour : ${thinMoments.map((m) => MOMENT_LABEL[m]).join(", ")}.</p>` : ""}
        ${state.weekMessage ? `<div class="week-msg ${stats.allRulesOk ? "ok" : "warn"}">${state.weekMessage}</div>` : ""}
        <div class="btn-row">
          <button class="primary" id="gen-week" ${lib.length < 5 ? "disabled" : ""}>Générer</button>
          <button id="save-week" ${!hasAnyMeals ? "disabled" : ""}>Sauvegarder</button>
        </div>
      </div>`;

        if (!hasAnyMeals) return html;

        // ── Sous-navigation (évite de tout scroller pour changer de section) ──
        const subTabs = [
          ["jours", "📅 Jours"],
          ["courses", "🛒 Courses"],
          ["coherence", `✅ Cohérence (${rulesOk}/${rulesTotal})`],
          ["sauvegardes", `🗂️ Sauvegardes (${state.savedWeeks.length})`],
        ];
        html += `<div class="subnav">${subTabs.map(([key, label]) => `<button class="subnav-btn${view === key ? " active" : ""}" data-sview="${key}">${label}</button>`).join("")}</div>`;

        if (view === "jours") html += renderJoursView();
        else if (view === "courses") html += renderShoppingListInner();
        else if (view === "coherence") {
          html += `<p style="font-size:12px;color:var(--ink-soft);padding:0 2px;margin:0 0 8px;line-height:1.5;">Repères PNNS 5 / ameli.fr + objectifs prise de masse.</p>
        <div class="card">${renderCoherenceItems()}</div>`;
        } else {
          html += renderSavedWeeks();
        }

        return html;
      }

      function macroBarPct(macros) {
        const p = macros.protein * 4,
          c = macros.carbs * 4,
          f = macros.fat * 9;
        const t = p + c + f || 1;
        return { p: (p / t) * 100, c: (c / t) * 100, f: (f / t) * 100 };
      }

      const PERIOD_GROUPS = [
        { label: "Matin", moments: ["petitdej", "collationmatin"] },
        { label: "Midi", moments: ["dejeuner", "collationapresmidi"] },
        { label: "Soir", moments: ["postworkout", "diner", "extra"] },
      ];

      // Vue "Jours": une strip de 7 jours pour naviguer + le détail d'un seul
      // jour à la fois (au lieu de 7 cartes empilées) pour limiter le scroll.
      function renderJoursView() {
        let html = `<div class="week-strip">`;
        DAYS.forEach((day) => {
          const targets = computeTargets(day.training);
          const totals = dayTotals(day.key);
          const bounds = dayKcalBounds(day.training, targets);
          const pct = Math.min(1.2, totals.kcal / Math.max(1, targets.kcal));
          const color =
            totals.kcal > bounds.max
              ? "var(--brick)"
              : totals.kcal < bounds.min
                ? "var(--amber)"
                : "var(--green)";
          const empty = state.plan[day.key].length === 0;
          const active = state.activeDay === day.key;
          html += `<div class="week-strip-day${active ? " wsd-active" : ""}" data-select-day="${day.key}">
            <div class="wsd-label">${day.label}</div>
            <div class="wsd-bar"><div class="wsd-fill" style="width:${empty ? 0 : Math.min(100, Math.round(pct * 100))}%;background:${color};"></div></div>
            <div class="wsd-pct">${empty ? "—" : Math.round(pct * 100) + "%"}</div>
          </div>`;
        });
        html += `</div>`;

        const day = DAYS.find((d) => d.key === state.activeDay) || DAYS[0];
        const targets = computeTargets(day.training);
        const totals = dayTotals(day.key);
        const bounds = dayKcalBounds(day.training, targets);
        const entries = planDayMeals(day.key);
        const isEmpty = entries.length === 0;
        const overshoot = totals.kcal > bounds.max;
        const pillCls = overshoot
          ? "brick"
          : totals.kcal < bounds.min
            ? "amber"
            : "";
        const dayComp = macroBarPct(totals);

        html += `<div class="card day-head-card">
          <div class="day-head-top">
            <div class="day-title">${day.label}</div>
            <span class="day-mode${day.training ? " is-training" : ""}">${day.training ? "Entraînement" : "Repos"}</span>
          </div>
          <div class="day-kcal-row">
            <span class="day-kcal">${isEmpty ? "—" : totals.kcal}</span>
            <span class="day-kcal-target">/ ${targets.kcal} kcal</span>
          </div>
          ${overshoot ? `<p style="font-size:11.5px;color:var(--brick);margin:6px 0 0;line-height:1.4;">▲ Ce jour dépasse le quota calorique — régénère la semaine, ou retire un repas ci-dessous.</p>` : ""}
          ${
            isEmpty
              ? ""
              : `<div class="mc-bar day-comp-bar">
            <div class="mc-bar-p" style="width:${dayComp.p}%;"></div>
            <div class="mc-bar-c" style="width:${dayComp.c}%;"></div>
            <div class="mc-bar-f" style="width:${dayComp.f}%;"></div>
          </div>`
          }
          <div class="day-macros">
            <div class="day-macro">
              <div class="dm-top"><span>Protéines</span><span>${totals.protein}/${targets.protein}g</span></div>
              <div class="dm-track"><div class="dm-fill dm-p" style="width:${targets.protein ? Math.min(115, (totals.protein / targets.protein) * 100) : 0}%;"></div></div>
            </div>
            <div class="day-macro">
              <div class="dm-top"><span>Glucides</span><span>${totals.carbs}/${targets.carbs}g</span></div>
              <div class="dm-track"><div class="dm-fill dm-c" style="width:${targets.carbs ? Math.min(115, (totals.carbs / targets.carbs) * 100) : 0}%;"></div></div>
            </div>
            <div class="day-macro">
              <div class="dm-top"><span>Lipides</span><span>${totals.fat}/${targets.fat}g</span></div>
              <div class="dm-track"><div class="dm-fill dm-f" style="width:${targets.fat ? Math.min(115, (totals.fat / targets.fat) * 100) : 0}%;"></div></div>
            </div>
          </div>
          ${
            isEmpty
              ? `<div class="empty" style="padding:12px 0 4px;"><p>Aucun repas pour ${day.label}.</p></div>`
              : `<div class="day-timeline">${PERIOD_GROUPS.map((period) => {
                  const periodEntries = entries
                    .map((e, i) => ({ ...e, i }))
                    .filter((e) => period.moments.includes(e.meal.moment));
                  if (!periodEntries.length) return "";
                  return `<div class="day-period">
                <div class="day-period-label">${period.label}</div>
                <div class="day-period-meals">
                ${periodEntries
                  .map(({ meal: m, scale, i }) => {
                    const macros = mac(m, scale);
                    const mb = macroBarPct(macros);
                    return `<div class="meal-card" data-view-recipe="${m.id}">

                  <div class="mc-head-row">
                    <div class="mc-moment">${MOMENT_LABEL[m.moment]}</div>
                    <span class="mc-open"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></span>
                  </div>
                  <div class="mc-name">${m.name}</div>
                  ${m.moment === "postworkout" ? '<span class="mc-tag">POST-SÉANCE</span>' : ""}
                  ${m.moment === "extra" ? '<span class="mc-tag">À FINIR</span>' : ""}
                  <div class="mc-foot">
                    <div class="mc-kcal">${macros.kcal}<span class="mc-kcal-unit">kcal</span></div>
                    <div class="mc-bar">
                      <div class="mc-bar-p" style="width:${mb.p}%;"></div>
                      <div class="mc-bar-c" style="width:${mb.c}%;"></div>
                      <div class="mc-bar-f" style="width:${mb.f}%;"></div>
                    </div>
                    <div class="mc-macro-row">
                      <span>${macros.protein}g P</span><span>${macros.carbs}g G</span><span>${macros.fat}g L</span>
                    </div>
                  </div>
                </div>`;
                  })
                  .join("")}
                </div>
              </div>`;
                }).join("")}</div>`
          }

        </div>`;

        return html;
      }
      // Regroupement "rayon de supermarché" pour une liste de courses qui se
      // parcourt dans l'ordre où on remplit vraiment son caddie.
      const AISLES = [
        { label: "🥦 Fruits & légumes", cats: ["legume", "fruit"] },
        {
          label: "🥩 Viandes, poissons, œufs",
          cats: [
            "viande_rouge",
            "volaille",
            "charcuterie",
            "poisson_maigre",
            "poisson_gras",
            "oeuf",
          ],
        },
        { label: "🧀 Produits laitiers", cats: ["laitier"] },
        { label: "🫘 Légumineuses", cats: ["legumineuse"] },
        {
          label: "🌾 Féculents & céréales",
          cats: ["feculent_complet", "feculent_raffine"],
        },
        {
          label: "🫙 Épicerie, matières grasses & condiments",
          cats: ["matiere_grasse", "condiment", "sucre", "oleagineux"],
        },
      ];
      // Pour les courses on arrondit à la pièce entière supérieure (on ne
      // peut pas acheter une demi-banane) — contrairement à l'affichage dans
      // la recette qui arrondit au plus proche.
      function formatShoppingAmount(key, grams) {
        const u = INGREDIENT_UNITS[key];
        if (u && u.piece) {
          const count = Math.max(1, Math.ceil(grams / u.unitG));
          const label = count === 1 ? u.label : u.labelPlural;
          return `${count} ${label}`;
        }
        if (LIQUID_KEYS.has(key)) return `${Math.round(grams)} ml`;
        return `${Math.round(grams)} g`;
      }
      function renderShoppingListInner() {
        const totals = {};
        const breakdown = {}; // key -> [{ dayLabel, mealName, grams }]
        DAYS.forEach((day) => {
          planDayMeals(day.key).forEach(({ meal: m, scale }) => {
            if (!m.ingredients) return;
            const scalableCats = mealScalableCats(m);
            m.ingredients.forEach(([key, g]) => {
              const n = NUTRI[key];
              const f = n && scalableCats.has(n.cat) ? scale : 1;
              const amt = g * f;
              totals[key] = (totals[key] || 0) + amt;
              (breakdown[key] = breakdown[key] || []).push({
                dayLabel: day.label,
                mealName: m.name,
                grams: amt,
              });
            });
          });
        });
        const keys = Object.keys(totals);
        if (!keys.length)
          return `<p style="font-size:13px;color:var(--ink-soft);padding:2px 0;">La liste apparaît dès que des repas sont planifiés.</p>`;
        const row = (k) => `<details class="shop-item">
              <summary><div class="mname">${NUTRI[k] ? NUTRI[k].label : k}</div><span class="pill">${formatShoppingAmount(k, totals[k])}</span></summary>
              <div class="shop-item-detail">
                ${breakdown[k].map((b) => `<div class="shop-item-line"><span>${b.dayLabel} · ${b.mealName}</span><span>${formatIngredientAmount(k, b.grams, NUTRI[k])}</span></div>`).join("")}
              </div>
            </details>`;
        const seen = new Set();
        const sections = AISLES.map((aisle) => {
          const aisleKeys = keys
            .filter((k) => NUTRI[k] && aisle.cats.includes(NUTRI[k].cat))
            .sort((a, b) => NUTRI[a].label.localeCompare(NUTRI[b].label));
          aisleKeys.forEach((k) => seen.add(k));
          if (!aisleKeys.length) return "";
          return `<div class="shop-aisle">
            <div class="shop-aisle-title">${aisle.label}</div>
            ${aisleKeys.map(row).join("")}
          </div>`;
        }).join("");
        const leftoverKeys = keys
          .filter((k) => !seen.has(k))
          .sort((a, b) =>
            (NUTRI[a]?.label || a).localeCompare(NUTRI[b]?.label || b),
          );
        const leftoverHtml = leftoverKeys.length
          ? `<div class="shop-aisle">
            <div class="shop-aisle-title">🗂️ Autre</div>
            ${leftoverKeys.map(row).join("")}
          </div>`
          : "";
        const notes = conservationNotes(totals);
        const conservationHtml = notes.length
          ? `<div class="card" style="margin-top:10px;">
            <div style="font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-bottom:6px;">🧊 À finir rapidement une fois ouvert</div>
            ${notes.map((n) => `<div class="coherence-item"><span class="ic" style="color:var(--amber);">▲</span><div class="txt"><b>${n.label}</b> ${n.packages > 1 ? `${n.packages} × ${n.size}${n.unit}` : `un format ${n.size}${n.unit}`} pour ${n.needed}${n.unit} utilisés cette semaine → il restera environ ${n.leftover}${n.unit} une fois ouvert, à consommer sous ${n.vie}. Pense à en réutiliser un peu dans une autre recette si possible.</div></div>`).join("")}
          </div>`
          : "";
        return `<div class="card">${sections}${leftoverHtml}</div>${conservationHtml}`;
      }

      // Date de consommation / durée de vie une fois le format entamé, pour
      // (quasi) tous les aliments : permet d'avertir quand une recette
      // n'épuise pas tout le paquet/pot et qu'il faudra le finir ailleurs
      // dans la semaine pour éviter le gaspillage, et d'aider les semaines
      // générées à réutiliser un format déjà entamé plutôt que d'en ouvrir
      // un nouveau. Exception : volaille (poulet/dinde), viande rouge
      // (steak/bœuf haché) et tous les poissons, achetés/cuisinés en
      // portions fraîches sans notion de pot entamé à finir.
      const SHELF_LIFE_EXCLUDED_CATS = new Set([
        "volaille",
        "viande_rouge",
        "poisson_maigre",
        "poisson_gras",
      ]);
      // Valeurs par défaut par catégorie (utilisées tant qu'aucune
      // correction spécifique n'est donnée ci-dessous).
      const CATEGORY_SHELF_DEFAULTS = {
        charcuterie: { size: 200, unit: "g", vie: "4-5 jours", days: 5 },
        oeuf: { size: 6, unit: "u", vie: "environ 3 semaines", days: 21 },
        laitier: { size: 200, unit: "g", vie: "4-5 jours", days: 5 },
        feculent_complet: {
          size: 500,
          unit: "g",
          vie: "plusieurs semaines (sec)",
          days: 60,
        },
        feculent_raffine: {
          size: 500,
          unit: "g",
          vie: "plusieurs semaines (sec)",

      // Table finale, générée pour tous les aliments non exclus : catégorie
      // par défaut, corrigée aliment par aliment quand nécessaire.
      const CONSERVATION_PACKAGES = Object.keys(NUTRI).reduce((acc, key) => {
        const n = NUTRI[key];
        if (!n || SHELF_LIFE_EXCLUDED_CATS.has(n.cat)) return acc;
        const base = CATEGORY_SHELF_DEFAULTS[n.cat];
        if (!base) return acc;
        acc[key] = { ...base, ...(ITEM_SHELF_OVERRIDES[key] || {}) };
        return acc;
      }, {});
      // Au-delà de ce nombre de jours, un aliment se garde de toute façon
      // largement plus longtemps qu'une semaine de plan (riz, huile,
      // épices, surgelés...) : pas besoin d'insister dessus pour inciter à
      // le réutiliser vite ni pour l'afficher en "à finir rapidement".
      const SHELF_LIFE_SOON_THRESHOLD = 10;

      // Pour chaque périssable, la recette "extra" ultra-rapide qui permet
      // de le finir sans en faire un vrai repas.
      const PERISH_QUICK_EXTRA = {
        lait: "m131",
        fromage_frais_leger: "m133",
        fromage_blanc: "m134",
      };
      function conservationNotes(totals) {
        return Object.keys(CONSERVATION_PACKAGES)
          .filter(
            (k) =>
              totals[k] &&
              CONSERVATION_PACKAGES[k].days <= SHELF_LIFE_SOON_THRESHOLD,
          )
          .map((k) => {
            const info = CONSERVATION_PACKAGES[k];
            const needed = totals[k];
            const packages = Math.max(1, Math.ceil(needed / info.size));
            const leftover = Math.round(packages * info.size - needed);
            return {
              key: k,
              label: NUTRI[k] ? NUTRI[k].label : k,
              needed: Math.round(needed),
              packages,
              size: info.size,
              unit: info.unit,
              leftover,
              vie: info.vie,
            };
          })
          .filter((n) => n.leftover > n.size * 0.15);
      }

      function saveCurrentWeek() {
        const hasAny = Object.values(state.plan).some((ids) => ids.length > 0);
        if (!hasAny) return;
        const now = new Date();
        const dateStr = now.toLocaleDateString("fr-FR", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });
        const id = now.getTime();
        state.savedWeeks.push({
          id,
          label: "Semaine du " + dateStr,
          date: dateStr,
          plan: JSON.parse(JSON.stringify(state.plan)),
        });
        saveState();
        render();
      }
